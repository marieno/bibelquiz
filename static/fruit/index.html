<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store"><title>BibelQuiz V11.0.3 fruit</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#123e69;background:linear-gradient(#ccefff,#fff2bf);min-height:100vh}main{max-width:900px;margin:auto;padding:14px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}button{border:0;border-radius:15px;padding:13px;font-weight:900;color:#123e69}.progress{height:18px;background:#dce9ef;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#48c965}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{background:#fff;min-height:72px;font-size:16px;box-shadow:0 4px 12px #0002}.scene{position:relative;min-height:52vh;border-radius:28px;overflow:hidden}.toast{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);background:#173d5d;color:#fff;padding:13px 18px;border-radius:18px;z-index:99;font-weight:900}.reward{text-align:center;background:#fff8;border-radius:28px;padding:24px}.big{font-size:95px}.stars{font-size:42px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}.themed{background:linear-gradient(#80d8ff 0 60%,#7ac45d 60%);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px}.themed>div{width:100%;text-align:center;font-size:100px}.themed span{background:#fff9;border-radius:12px;padding:8px;font-weight:900}.phase{display:inline-block;background:#fff;padding:8px 12px;border-radius:14px;font-weight:900}.hearts{text-align:center;font-size:28px}.themed{background:linear-gradient(#7ed8ff,#7bc65d);display:flex;align-items:center;justify-content:center}.sceneIcon{font-size:145px}.badge{font-size:90px}.next-btn{display:block;width:min(92%,520px);margin:18px auto;padding:18px 20px!important;background:#48c965!important;color:#fff!important;font-size:18px!important}.correct-reveal{background:#dff8e5;border:3px solid #48c965;border-radius:17px;padding:14px;margin:12px;text-align:center}.learning-help{background:#fff8;border-radius:15px;padding:10px}.master-top{display:flex;justify-content:space-between}.scorebox,.instruction,.preview{background:#fff;padding:10px;border-radius:12px}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memory-card{min-height:100px;background:#164d7b;color:#fff}.memory-card.open,.memory-card.done{background:#fff;color:#123e69}.token-bank,.preview-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.token{background:#fff;padding:11px}.token.selected{outline:5px solid #ffd343}.dropzone{border:5px dashed #fff;background:#fff6;border-radius:24px;padding:12px;text-align:center}.tree{font-size:170px}.soldier{text-align:center;font-size:160px}.countdown{text-align:center;font-size:60px}.boat-scene,.camp-scene{min-height:240px;border-radius:24px;display:grid;place-items:center;font-size:80px}.boat-scene{background:#68ccef}.camp-scene{background:#dfc47c}.master-end{text-align:center;background:#fff;padding:24px;border-radius:24px}.medal{font-size:90px}.next-btn{display:block;width:90%;margin:15px auto;background:#48c965!important;color:#fff!important}@media(max-width:600px){.memory-grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><div id="game"><main><div class="card"><h2>🔵 HTML V11.0.3 chargé</h2><p>fruit</p></div></main></div><script>
(function(){
  var root=document.getElementById("game");
  function show(msg,detail){
    if(!root)return;
    root.innerHTML='<main><div class="card"><h2>'+msg+'</h2>'+(detail?'<pre style="white-space:pre-wrap;text-align:left">'+String(detail).replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</pre>':'')+'<button onclick="location.href=\'/\'">← BibelQuiz</button></div></main>';
  }
  show("✅ BOOT HTML V11.0.3","fruit");
  window.addEventListener("error",function(e){show("⚠️ ERREUR JAVASCRIPT", (e.message||"Erreur")+" @ "+(e.filename||"inline")+":"+(e.lineno||0)+":"+(e.colno||0));});
  setTimeout(function(){
    try{
      const lang=localStorage.getItem("bibelquiz_language")==="fr"?"fr":"de",G=document.getElementById("game"),sh=a=>[...a].sort(()=>Math.random()-.5);let score=0,maxScore=0;function say(x){if(!("speechSynthesis"in window))return;let u=new SpeechSynthesisUtterance(String(x));u.lang=lang==="fr"?"fr-FR":"de-DE";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}function toast(x){let d=document.createElement("div");d.className="toast";d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}function top(t,p){return `<header><button onclick="location.href='/'">← BibelQuiz</button><h2>${t}</h2></header><div class=master-top><b>${p}</b><span class=scorebox>⭐ ${score}/${maxScore}</span></div>`}function good(){score++;maxScore++;toast("✨ +1 ⭐")}function bad(){maxScore++;toast(lang==="fr"?"Essaie encore 😊":"Versuch es noch einmal 😊")}function finish(t,i){let p=maxScore?score/maxScore:1,m=p>=.85?"🥇":p>=.65?"🥈":"🥉";G.innerHTML=`<main><div class=master-end><div class=medal>${m}</div><h1>${i} ${t}</h1><p>⭐ ${score}/${maxScore}</p><button onclick="location.reload()">🔄</button> <button onclick="location.href='/'">← BibelQuiz</button></div></main>`}const F=lang==="fr"?["Amour", "Joie", "Paix", "Patience", "Bonté", "Bienveillance", "Fidélité", "Douceur", "Maîtrise de soi"]:["Liebe", "Freude", "Friede", "Geduld", "Freundlichkeit", "Güte", "Treue", "Sanftmut", "Selbstbeherrschung"],B=lang==="fr"?["Jalousie", "Colère", "Haine", "Mensonge", "Orgueil", "Impatience", "Égoïsme", "Méchanceté", "Envie"]:["Eifersucht", "Zorn", "Hass", "Lüge", "Stolz", "Ungeduld", "Egoismus", "Bosheit", "Neid"];let n=0,sel=null,on=[],pool=[];
function learn(){if(n===9)return treeGame();G.innerHTML=`<main>${top("🌳 "+(lang==="fr"?"Fruit de l’Esprit":"Frucht des Geistes"),"1. "+(lang==="fr"?"DÉCOUVRIR":"ENTDECKEN"))}<div class=dropzone><div class=tree>🌳</div></div><div class=card><h1>🍎 ${F[n]}</h1><button onclick="say(F[n])">🔊</button><button class=next-btn onclick="n++;learn()">→</button></div></main>`}
function treeGame(){pool=sh([...F.map(x=>({x,ok:1})),...B.map(x=>({x,ok:0}))]);on=[];draw()}
function draw(){if(on.length===9)return finish(lang==="fr"?"Fruit de l’Esprit":"Frucht des Geistes","🌳");G.innerHTML=`<main>${top("🌳","2. "+(lang==="fr"?"REMPLIS L’ARBRE":"FÜLLE DEN BAUM"))}<div class=instruction>${lang==="fr"?"Parmi 18 qualités, choisis seulement les 9 fruits de l’Esprit puis touche l’arbre.":"Wähle unter 18 Eigenschaften nur die 9 Früchte des Geistes und tippe auf den Baum."}</div><div class=dropzone onclick="drop()"><div class=tree>🌳</div>${on.map(x=>`<span class=preview>🍎 ${x}</span>`).join("")}</div><div class=token-bank>${pool.map((o,i)=>`<button class="token ${sel===i?"selected":""}" onclick="sel=${i};draw()">${o.x}</button>`).join("")}</div></main>`}
function drop(){if(sel===null)return;let o=pool[sel];if(!o.ok){bad();sel=null;return draw()}good();on.push(o.x);pool.splice(sel,1);sel=null;draw()}learn();
    }catch(e){
      show("⚠️ ERREUR AU DÉMARRAGE", (e&&e.name?e.name+": ":"")+(e&&e.message?e.message:String(e))+(e&&e.stack?"\n"+e.stack:""));
    }
  },0);
})();
</script></body></html>
