<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store"><title>BibelQuiz V11.0.6 fruit</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#123e69;background:linear-gradient(#ccefff,#fff2bf);min-height:100vh}main{max-width:900px;margin:auto;padding:14px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}button{border:0;border-radius:15px;padding:13px;font-weight:900;color:#123e69}.progress{height:18px;background:#dce9ef;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#48c965}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{background:#fff;min-height:72px;font-size:16px;box-shadow:0 4px 12px #0002}.scene{position:relative;min-height:52vh;border-radius:28px;overflow:hidden}.toast{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);background:#173d5d;color:#fff;padding:13px 18px;border-radius:18px;z-index:99;font-weight:900}.reward{text-align:center;background:#fff8;border-radius:28px;padding:24px}.big{font-size:95px}.stars{font-size:42px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}.themed{background:linear-gradient(#80d8ff 0 60%,#7ac45d 60%);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px}.themed>div{width:100%;text-align:center;font-size:100px}.themed span{background:#fff9;border-radius:12px;padding:8px;font-weight:900}.phase{display:inline-block;background:#fff;padding:8px 12px;border-radius:14px;font-weight:900}.hearts{text-align:center;font-size:28px}.themed{background:linear-gradient(#7ed8ff,#7bc65d);display:flex;align-items:center;justify-content:center}.sceneIcon{font-size:145px}.badge{font-size:90px}.next-btn{display:block;width:min(92%,520px);margin:18px auto;padding:18px 20px!important;background:#48c965!important;color:#fff!important;font-size:18px!important}.correct-reveal{background:#dff8e5;border:3px solid #48c965;border-radius:17px;padding:14px;margin:12px;text-align:center}.learning-help{background:#fff8;border-radius:15px;padding:10px}.master-top{display:flex;justify-content:space-between}.scorebox,.instruction,.preview{background:#fff;padding:10px;border-radius:12px}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memory-card{min-height:100px;background:#164d7b;color:#fff}.memory-card.open,.memory-card.done{background:#fff;color:#123e69}.token-bank,.preview-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.token{background:#fff;padding:11px}.token.selected{outline:5px solid #ffd343}.dropzone{border:5px dashed #fff;background:#fff6;border-radius:24px;padding:12px;text-align:center}.tree{font-size:170px}.soldier{text-align:center;font-size:160px}.countdown{text-align:center;font-size:60px}.boat-scene,.camp-scene{min-height:240px;border-radius:24px;display:grid;place-items:center;font-size:80px}.boat-scene{background:#68ccef}.camp-scene{background:#dfc47c}.master-end{text-align:center;background:#fff;padding:24px;border-radius:24px}.medal{font-size:90px}.next-btn{display:block;width:90%;margin:15px auto;background:#48c965!important;color:#fff!important}@media(max-width:600px){.memory-grid{grid-template-columns:repeat(3,1fr)}}
.draggable{touch-action:none;cursor:grab}.dragging{opacity:.55;transform:scale(1.08)}
.drop-active{outline:6px solid #ffd54f}
.balloon-stage{position:relative;height:62vh;overflow:hidden;border-radius:25px;background:linear-gradient(#86dcff,#e7f8ff)}
.balloon{position:absolute;width:115px;min-height:135px;border-radius:55% 55% 48% 48%;background:#fff;border:4px solid #69a8d5;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-weight:900;box-shadow:0 6px 14px #0002;animation:floatDown 8s linear forwards}
.balloon:after{content:"";position:absolute;bottom:-22px;width:2px;height:22px;background:#555}
@keyframes floatDown{from{top:-150px}to{top:105%}}
.equip-person{position:relative;width:230px;height:350px;margin:auto}.equip-person .body{font-size:210px;position:absolute;inset:45px 0 0;text-align:center}.worn{position:absolute;z-index:3;font-size:52px}.worn.head{top:18px;left:89px}.worn.left{top:145px;left:25px}.worn.right{top:145px;right:22px}.worn.waist{top:190px;left:92px}.worn.chest{top:112px;left:90px}.worn.feet{bottom:5px;left:83px}
.memory-scene{font-size:34px;min-height:100px;display:grid;place-items:center}
</style></head><body><div id="game"><main><div class="card"><h2>🔵 HTML V11.0.6 chargé</h2><p>fruit</p></div></main></div><script>
(function(){
  var root=document.getElementById("game");
  function show(msg,detail){
    if(!root)return;
    root.innerHTML='<main><div class="card"><h2>'+msg+'</h2>'+(detail?'<pre style="white-space:pre-wrap;text-align:left">'+String(detail).replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</pre>':'')+'<button data-home="1">← BibelQuiz</button></div></main>';
  }
  show("✅ BOOT HTML V11.0.6","fruit");
  window.addEventListener("error",function(e){show("⚠️ ERREUR JAVASCRIPT", (e.message||"Erreur")+" @ "+(e.filename||"inline")+":"+(e.lineno||0)+":"+(e.colno||0));});
  setTimeout(function(){
    try{
      const lang=localStorage.getItem("bibelquiz_language")==="fr"?"fr":"de",G=document.getElementById("game"),sh=a=>[...a].sort(()=>Math.random()-.5);let score=0,maxScore=0;function say(x){if(!("speechSynthesis"in window))return;let u=new SpeechSynthesisUtterance(String(x));u.lang=lang==="fr"?"fr-FR":"de-DE";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}function toast(x){let d=document.createElement("div");d.className="toast";d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}function top(t,p){return `<header><button data-home="1">← BibelQuiz</button><h2>${t}</h2></header><div class=master-top><b>${p}</b><span class=scorebox>⭐ ${score}/${maxScore}</span></div>`}function good(){score++;maxScore++;toast("✨ +1 ⭐")}function bad(){maxScore++;toast(lang==="fr"?"Essaie encore 😊":"Versuch es noch einmal 😊")}function finish(t,i){let p=maxScore?score/maxScore:1,m=p>=.85?"🥇":p>=.65?"🥈":"🥉";G.innerHTML=`<main><div class=master-end><div class=medal>${m}</div><h1>${i} ${t}</h1><p>⭐ ${score}/${maxScore}</p><button data-reload="1">🔄</button> <button data-home="1">← BibelQuiz</button></div></main>`}const F=lang==="fr"?["Amour", "Joie", "Paix", "Patience", "Bonté", "Bienveillance", "Fidélité", "Douceur", "Maîtrise de soi"]:["Liebe", "Freude", "Friede", "Geduld", "Freundlichkeit", "Güte", "Treue", "Sanftmut", "Selbstbeherrschung"],B=lang==="fr"?["Sagesse","Courage","Obéissance","Générosité","Respect","Pardon","Jalousie","Colère","Mensonge"]:["Weisheit","Mut","Gehorsam","Großzügigkeit","Respekt","Vergebung","Eifersucht","Zorn","Lüge"];let n=0,sel=null,on=[],pool=[];
function learn(){if(n===9)return treeGame();G.innerHTML=`<main>${top("🌳 "+(lang==="fr"?"Fruit de l’Esprit":"Frucht des Geistes"),"1. "+(lang==="fr"?"DÉCOUVRIR":"ENTDECKEN"))}<div class=dropzone><div class=tree>🌳</div></div><div class=card><h1>🍎 ${F[n]}</h1><button data-act="speakCurrent">🔊</button><button class=next-btn data-act="nextLearn">→</button></div></main>`;say(F[n])}
function treeGame(){pool=sh([...F.map(x=>({x,ok:1})),...B.map(x=>({x,ok:0}))]);on=[];draw()}
function draw(){if(on.length===9)return fruitMemory();G.innerHTML=`<main>${top("🌳","2. "+(lang==="fr"?"REMPLIS L’ARBRE":"FÜLLE DEN BAUM"))}<div class=instruction>${lang==="fr"?"Parmi ces qualités, certaines sont bonnes mais ne font pas partie des 9 fruits. Glisse uniquement les 9 fruits sur l’arbre.":"Einige Eigenschaften sind gut, gehören aber nicht zu den 9 Früchten. Ziehe nur die 9 Früchte auf den Baum."}</div><div class=dropzone data-act="drop" data-drop="tree"><div class=tree>🌳</div>${on.map(x=>`<span class=preview>🍎 ${x}</span>`).join("")}</div><div class=token-bank>${pool.map((o,i)=>`<button class="token ${sel===i?"selected":""}" data-act="select" data-i="${i}" data-drag="${i}">${o.x}</button>`).join("")}</div></main>`}
function drop(){if(sel===null)return;let o=pool[sel];if(!o.ok){bad();sel=null;return draw()}good();on.push(o.x);pool.splice(sel,1);sel=null;draw()}
window.say=say;window.learn=learn;window.draw=draw;window.drop=drop;
document.addEventListener("click",function(e){let b=e.target.closest("button");if(!b)return;if(b.dataset.home){location.href="/";return}if(b.dataset.reload){location.reload();return}let a=b.dataset.act;if(a==="speakCurrent")say(F[n]);else if(a==="nextLearn"){n++;learn()}else if(a==="select"){sel=Number(b.dataset.i);draw()}else if(a==="drop")drop()});

let dragEl=null,dragData=null;
function enableDrag(){
 document.querySelectorAll("[data-drag]").forEach(el=>{
  el.classList.add("draggable");
  el.onpointerdown=e=>{dragEl=el;dragData=el.dataset.drag;el.setPointerCapture?.(e.pointerId);el.classList.add("dragging")};
  el.onpointerup=e=>{if(!dragEl)return;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-drop]");dragEl.classList.remove("dragging");if(target)handleDrop(dragData,target.dataset.drop);dragEl=null;dragData=null};
 });
}
function handleDrop(data,target){if(target!=="tree")return;sel=Number(data);drop()}
function fruitMemory(){
 let pairs=sh(F.slice(0,6).flatMap((x,i)=>[{i,text:"🍎 "+x},{i,text:["❤️","😄","🕊️","⏳","🤲","✨"][i]}])),open=[],done=new Set(),lock=false;
 function render(){if(done.size===6)return fruitBalloons();G.innerHTML=`<main>${top("🌳 Memory","🧠 MEMORY")}<div class=instruction>${lang==="fr"?"Trouve les paires fruit ↔ symbole.":"Finde die Paare Frucht ↔ Symbol."}</div><div class=memory-grid>${pairs.map((c,k)=>`<button class="memory-card ${done.has(c.i)?"done":open.includes(k)?"open":""}" data-fm="${k}">${done.has(c.i)||open.includes(k)?c.text:"❓"}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-fm]").forEach(b=>b.addEventListener("click",()=>flip(Number(b.dataset.fm))))}
 function flip(k){if(lock||open.includes(k)||done.has(pairs[k].i))return;open.push(k);render();if(open.length===2){lock=true;setTimeout(()=>{let a=pairs[open[0]],b=pairs[open[1]];if(a.i===b.i){done.add(a.i);good()}else bad();open=[];lock=false;render()},550)}}render()
}
function fruitBalloons(){
 let items=sh([...F.slice(0,6).map(x=>({x,ok:1})),...B.slice(0,5).map(x=>({x,ok:0}))]),hit=0;G.innerHTML=`<main>${top("🌳","🎈 BALLOONS")}<div class=instruction>${lang==="fr"?"Éclate uniquement les fruits de l’Esprit !":"Zerplatze nur die Früchte des Geistes!"}</div><div class=balloon-stage id=bs></div></main>`;let st=document.getElementById("bs");items.forEach((o,i)=>{let b=document.createElement("button");b.className="balloon";b.textContent=o.x;b.style.left=(5+(i*18)%75)+"%";b.style.animationDelay=(i*.45)+"s";b.onclick=()=>{if(o.ok){good();hit++;b.remove();if(hit===6)setTimeout(()=>finish(lang==="fr"?"Fruit de l’Esprit":"Frucht des Geistes","🌳"),300)}else bad()};st.appendChild(b)})
}
learn();
    }catch(e){
      show("⚠️ ERREUR AU DÉMARRAGE", (e&&e.name?e.name+": ":"")+(e&&e.message?e.message:String(e))+(e&&e.stack?"\n"+e.stack:""));
    }
  },0);
})();
</script></body></html>
