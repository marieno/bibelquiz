<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Tycoon</title><link rel="stylesheet" href="style.css"></head><body><header><a href="/">← BibelQuiz</a><h1>🏡 Bible Tycoon</h1><button id="language">DE</button></header><section class="room"><input id="playerName" maxlength="24" placeholder="Prénom / Name" aria-label="Prénom"><input id="roomCode" maxlength="6" inputmode="numeric" placeholder="Code à 6 chiffres" aria-label="Code du monde"><button id="createRoom">🏡 Créer / Erstellen</button><button id="joinRoom">🚪 Rejoindre / Beitreten</button><button id="leaveRoom" hidden>Quitter / Verlassen</button><strong id="roomStatus" aria-live="polite"></strong></section><section id="stats"></section><main><div class="boardwrap"><div class="viewtools"><button id="toggle3d" type="button">🧊 Vue 3D</button><button id="rotateLeft" type="button">↶</button><button id="rotateRight" type="button">↷</button><button id="zoomIn" type="button">＋</button><button id="zoomOut" type="button">－</button><span id="viewStatus" role="status"></span></div><div id="scene3d" hidden aria-label="Village en trois dimensions"></div><div id="board" aria-label="Village"></div></div><aside><h2 id="shopTitle"></h2><div id="shop"></div><h2 id="missionTitle"></h2><div id="mission"></div><h2 id="questsHeading">📜 Missions bibliques</h2><div id="questList"></div><p id="feedback" role="status"></p><button id="reset"></button></aside></main><footer id="hint"></footer><script src="game.js"></script><script type="module" src="scene3d.js"></script></body></html>
