<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#123e69;background:linear-gradient(#ccefff,#fff2bd);min-height:100vh}main{max-width:850px;margin:auto;padding:14px}button{border:0;border-radius:16px;padding:12px;font-weight:850;color:#123e69}header{display:flex;gap:10px;align-items:center;justify-content:space-between}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{background:#fff;min-height:130px;font-size:17px}.item span{display:block;font-size:52px}.work{display:grid;grid-template-columns:180px 1fr;gap:14px}.model,.canvas{background:#fff;border-radius:24px;padding:10px;text-align:center}.model svg{width:150px;height:150px}.canvas svg{width:min(100%,520px);height:auto;touch-action:none}.paint{stroke:#123e69;stroke-width:5;cursor:pointer}.palette{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}.sw{width:52px;height:52px;border-radius:50%;border:5px solid white;box-shadow:0 2px 8px #0004}.sw.sel{outline:5px solid #123e69}.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.done{background:#48c968;color:white;font-size:19px}.info{background:#fff;border-radius:24px;padding:22px;text-align:center}.big{font-size:90px}.quiz{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quiz button{background:#fff;min-height:80px}@media(max-width:650px){.gallery{grid-template-columns:repeat(2,1fr)}.work{grid-template-columns:1fr}.model{display:flex;align-items:center;justify-content:center;gap:10px}.model svg{width:100px;height:100px}}
.artboard{position:relative;aspect-ratio:1/1;overflow:hidden}.artboard canvas,.zoneLayer{position:absolute;inset:0;width:100%;height:100%}.zoneLayer svg{width:100%;height:100%}.artboard canvas{z-index:4;touch-action:none}.zoneLayer{z-index:3}.tools button.active{outline:5px solid #ffca28;background:#fff7c2}.paint{touch-action:none}.tools{position:relative;z-index:10}</style><script src="/static/bq-audio.js"></script></head><body><div id=game></div><script>
const ITEMS=[["ark", "📦", "Arche de l’Alliance", "Bundeslade", "Ark of the Covenant", "Elle rappelait l’alliance de Dieu avec Israël et se trouvait dans le lieu très saint.", "Sie erinnerte an Gottes Bund mit Israel und stand im Allerheiligsten.", "It represented God's covenant with Israel and stood in the Most Holy Place."], ["menorah", "🕎", "Chandelier à sept branches", "Siebenarmiger Leuchter", "Seven-branched lampstand", "Le chandelier éclairait le sanctuaire du tabernacle.", "Der Leuchter gab im Heiligtum des Zeltes Licht.", "The lampstand gave light inside the tabernacle sanctuary."], ["scroll", "📜", "Rouleau", "Schriftrolle", "Scroll", "Les textes étaient écrits sur des rouleaux bien avant nos livres modernes.", "Texte wurden auf Schriftrollen geschrieben, lange vor unseren heutigen Büchern.", "Texts were written on scrolls long before modern books."], ["lamp", "🪔", "Lampe à huile", "Öllampe", "Oil lamp", "Les lampes à huile servaient à éclairer les maisons et apparaissent aussi dans les enseignements de Jésus.", "Öllampen gaben in Häusern Licht und kommen auch in Jesu Lehren vor.", "Oil lamps lit homes and also appear in Jesus' teachings."], ["jar", "🏺", "Jarre", "Krug", "Jar", "Des jarres servaient à conserver ou transporter de l’eau et d’autres produits.", "Krüge wurden zum Aufbewahren und Tragen von Wasser und anderen Dingen benutzt.", "Jars were used to store and carry water and other goods."], ["mosesbasket", "🧺", "Panier de Moïse", "Moses Körbchen", "Moses' basket", "Moïse bébé fut placé dans une corbeille parmi les roseaux du Nil.", "Der kleine Mose wurde in ein Körbchen im Schilf des Nils gelegt.", "Baby Moses was placed in a basket among the reeds of the Nile."], ["tablets", "🪨", "Tables de la Loi", "Gesetzestafeln", "Tablets of the Law", "Les tables rappellent les commandements donnés à Moïse.", "Die Tafeln erinnern an die Gebote, die Mose gegeben wurden.", "The tablets remind us of the commandments given to Moses."], ["lyre", "🎵", "Lyre de David", "Davids Leier", "David's lyre", "David jouait d’un instrument à cordes pour Saül.", "David spielte für Saul auf einem Saiteninstrument.", "David played a stringed instrument for Saul."], ["crown", "👑", "Couronne royale", "Königskrone", "Royal crown", "La couronne représente ici la royauté des rois bibliques.", "Die Krone steht hier für das Königtum der biblischen Könige.", "The crown represents the kingship of biblical kings."], ["shofar", "📯", "Shofar", "Schofar", "Shofar", "Le shofar est une trompe faite d’une corne, utilisée dans plusieurs contextes bibliques.", "Der Schofar ist ein Blasinstrument aus einem Horn und wird in verschiedenen biblischen Zusammenhängen verwendet.", "The shofar is a horn instrument used in several biblical settings."], ["boat", "⛵", "Barque", "Boot", "Boat", "Jésus et ses disciples traversaient souvent le lac de Galilée en barque.", "Jesus und seine Jünger fuhren oft mit einem Boot über den See Genezareth.", "Jesus and his disciples often crossed the Sea of Galilee by boat."], ["net", "🎣", "Filet de pêche", "Fischernetz", "Fishing net", "Plusieurs disciples étaient pêcheurs et travaillaient avec des filets.", "Mehrere Jünger waren Fischer und arbeiteten mit Netzen.", "Several disciples were fishermen who worked with nets."]],lang=localStorage.getItem("bibelquiz_language")==="fr"?"fr":(localStorage.getItem("bibelquiz_language")==="en"?"en":"de"),G=document.getElementById("game");
const COLORS=["#ef5350","#ffca28","#66bb6a","#42a5f5","#ab47bc","#ff8a65","#8d6e63","#eceff1","#263238","#f8bbd0"],canonical=["#ffca28","#8d6e63","#42a5f5","#ef5350","#66bb6a","#ab47bc"];
let item=null,color=COLORS[0],tool="fill",fills=Array(6).fill("#fff"),painted=new Set(),undoStack=[],canvas,ctx,drawing=false,last=null,strokeBefore=null;
function L(x){return lang==="fr"?x[2]:lang==="de"?x[3]:x[4]}function explain(x){return lang==="fr"?x[5]:lang==="de"?x[6]:x[7]}function say(t){if(window.BQAudio)BQAudio.speak(t)}
function svg(model=false){let f=model?canonical:fills;return `<svg viewBox="0 0 500 500"><rect class="${model?"":"paint"}" data-r="0" x="95" y="95" rx="45" width="310" height="260" fill="${f[0]}"/><circle class="${model?"":"paint"}" data-r="1" cx="180" cy="190" r="62" fill="${f[1]}"/><circle class="${model?"":"paint"}" data-r="2" cx="320" cy="190" r="62" fill="${f[2]}"/><path class="${model?"":"paint"}" data-r="3" d="M140 310 L250 215 L360 310 Z" fill="${f[3]}"/><rect class="${model?"":"paint"}" data-r="4" x="205" y="275" width="90" height="120" rx="18" fill="${f[4]}"/><circle class="${model?"":"paint"}" data-r="5" cx="250" cy="135" r="38" fill="${f[5]}"/><text x="250" y="255" text-anchor="middle" font-size="95">${item[1]}</text></svg>`}
function gallery(){G.innerHTML=`<main><header><button onclick="location.href='/'">← BibelQuiz</button><h1>🎨 ${lang==="fr"?"Atelier biblique":lang==="de"?"Bibel-Malwerkstatt":"Bible Coloring Workshop"}</h1></header><div class=gallery>${ITEMS.map((x,i)=>`<button class=item data-i="${i}"><span>${x[1]}</span>${L(x)}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>start(+b.dataset.i))}
function start(i){item=ITEMS[i];color=COLORS[0];tool="fill";fills=Array(6).fill("#fff");painted=new Set();undoStack=[];renderWork()}
function renderWork(){
 G.innerHTML=`<main><header><button id=back>←</button><h2>🎨 ${L(item)}</h2></header><div class=work><div class=model><b>${lang==="fr"?"Exemple":lang==="de"?"Beispiel":"Example"}</b>${svg(true)}</div><div class="canvas artboard"><canvas id=freeCanvas width=500 height=500></canvas><div class=zoneLayer>${svg(false)}</div></div></div><div class=palette>${COLORS.map(c=>`<button class="sw ${c===color?"sel":""}" data-c="${c}" style="background:${c}"></button>`).join("")}</div><div class=tools><button data-tool=fill>🪣 ${lang==="fr"?"Remplir":lang==="de"?"Füllen":"Fill"}</button><button data-tool=brush>🖌️ ${lang==="fr"?"Pinceau":lang==="de"?"Pinsel":"Brush"}</button><button data-tool=eraser>🧽 ${lang==="fr"?"Gomme":lang==="de"?"Radierer":"Eraser"}</button><button id=undo>↩️ ${lang==="fr"?"Annuler":lang==="de"?"Zurück":"Undo"}</button><button id=reset>🔄 ${lang==="fr"?"Recommencer":lang==="de"?"Neu":"Reset"}</button><button id=finish class=done>✅ ${lang==="fr"?"TERMINÉ":lang==="de"?"FERTIG":"DONE"}</button></div></main>`;
 canvas=document.getElementById("freeCanvas");ctx=canvas.getContext("2d");restoreCanvas();bind();
}
function bind(){
 back.onclick=gallery;
 document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{color=b.dataset.c;document.querySelectorAll(".sw").forEach(x=>x.classList.toggle("sel",x.dataset.c===color))});
 document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll("[data-tool]").forEach(x=>x.classList.toggle("active",x.dataset.tool===tool));document.querySelector(".zoneLayer").style.pointerEvents=tool==="fill"?"auto":"none";canvas.style.pointerEvents=tool==="fill"?"none":"auto"});
 document.querySelector(`[data-tool="${tool}"]`)?.classList.add("active");document.querySelector(".zoneLayer").style.pointerEvents=tool==="fill"?"auto":"none";canvas.style.pointerEvents=tool==="fill"?"none":"auto";
 document.querySelectorAll(".paint").forEach(r=>r.onclick=()=>fillRegion(+r.dataset.r));
 undo.onclick=undoAction;reset.onclick=()=>start(ITEMS.indexOf(item));finish.onclick=finishWork;
 canvas.addEventListener("pointerdown",brushStart);canvas.addEventListener("pointermove",brushMove);canvas.addEventListener("pointerup",brushEnd);canvas.addEventListener("pointercancel",brushEnd);
}
function snapshot(kind){undoStack.push({kind,fills:[...fills],painted:[...painted],image:canvas?canvas.toDataURL():null});if(undoStack.length>30)undoStack.shift()}
function fillRegion(i){snapshot("fill");fills[i]=color;painted.add(i);let r=document.querySelector(`.zoneLayer [data-r="${i}"]`);if(r)r.setAttribute("fill",color)}
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function brushStart(e){snapshot(tool);drawing=true;last=point(e);canvas.setPointerCapture?.(e.pointerId);e.preventDefault()}
function brushMove(e){if(!drawing)return;let q=point(e);ctx.save();ctx.lineCap="round";ctx.lineJoin="round";ctx.lineWidth=tool==="eraser"?30:14;ctx.globalCompositeOperation=tool==="eraser"?"destination-out":"source-over";ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.restore();last=q;e.preventDefault()}
function brushEnd(e){drawing=false;last=null}
function undoAction(){let u=undoStack.pop();if(!u)return;fills=[...u.fills];painted=new Set(u.painted);document.querySelectorAll(".zoneLayer .paint").forEach(r=>r.setAttribute("fill",fills[+r.dataset.r]));clearCanvas(()=>{if(u.image)loadImage(u.image)})}
function clearCanvas(cb){ctx.clearRect(0,0,canvas.width,canvas.height);if(cb)cb()}
function loadImage(src){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0,500,500);im.src=src}
function restoreCanvas(){}
function finishWork(){if(painted.size<3&&undoStack.length<3){alert(lang==="fr"?"Colorie encore quelques parties 😊":lang==="de"?"Male noch ein paar Flächen aus 😊":"Color a few more parts 😊");return}let t=explain(item);G.innerHTML=`<main><div class=info><div class=big>${item[1]}</div><h1>${L(item)}</h1><p>${t}</p><button id=listen>🔊</button><button id=q class=done>❓ ${lang==="fr"?"RECONNAÎTRE":lang==="de"?"ERKENNEN":"RECOGNIZE"}</button></div></main>`;say(L(item)+". "+t);listen.onclick=()=>say(L(item)+". "+t);q.onclick=quiz}
function quiz(){let wrong=ITEMS.filter(x=>x[0]!==item[0]).sort(()=>Math.random()-.5).slice(0,3),opts=[item,...wrong].sort(()=>Math.random()-.5);G.innerHTML=`<main><div class=info><div class=big>${item[1]}</div><h2>${lang==="fr"?"Quel objet est-ce ?":lang==="de"?"Welcher Gegenstand ist das?":"What object is this?"}</h2><div class=quiz>${opts.map((x,i)=>`<button data-q="${i}">${L(x)}</button>`).join("")}</div></div></main>`;document.querySelectorAll("[data-q]").forEach((b,i)=>b.onclick=()=>{if(opts[i][0]===item[0])setTimeout(gallery,300);else b.style.opacity=.35})}
gallery();
</script></body></html>
