<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#123e69;background:linear-gradient(#ccefff,#fff1bf);min-height:100vh}main{max-width:900px;margin:auto;padding:14px}button{border:0;border-radius:15px;padding:13px;font-weight:850;color:#123e69}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice,.card{background:#fff;min-height:90px}.card{border-radius:20px;padding:16px;margin:10px 0}.story-stage{height:280px;border-radius:24px;background:linear-gradient(#8bdcff 0 62%,#8fca6e 62%);position:relative;overflow:hidden}.actor{position:absolute;bottom:30px;font-size:75px}.a{left:16%}.b{right:16%}.object{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:78px}.caption{background:#fff;border-radius:18px;padding:15px;font-size:19px;font-weight:800;margin:10px 0}.next{display:block;width:90%;margin:12px auto;background:#49c969;color:white}.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kingdom{border-radius:22px;padding:14px}.north{background:#bce5ff}.south{background:#ffd8a8}.timeline{display:grid;grid-template-columns:1fr 1fr;gap:10px}.timeline .lane{background:#fff8;padding:12px;border-radius:18px}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memory-card{min-height:90px;background:#164d7b;color:#fff}.memory-card.open,.memory-card.done{background:#fff;color:#123e69}.reward{text-align:center;background:#fff;border-radius:25px;padding:25px}.goodking{border:4px solid #52b76b}.badking{border:4px solid #dc6666}.bq-music{position:fixed;right:10px;bottom:10px;z-index:9999}.bq-music button{background:#fff}@media(max-width:600px){.map,.timeline{grid-template-columns:1fr}.memory-grid{grid-template-columns:repeat(3,1fr)}}</style><script src="/static/bq-audio.js"></script></head><body><div id=game></div><script>const lang=localStorage.getItem("bibelquiz_language")==="fr"?"fr":"de",G=document.getElementById("game"),sh=a=>[...a].sort(()=>Math.random()-.5);function say(x){if(window.BQAudio)return BQAudio.speak(x)}function reward(t,i){G.innerHTML=`<main><div class=reward><div style="font-size:90px">${i}</div><h1>${t}</h1><button onclick="location.href='/'">← BibelQuiz</button></div></main>`}function storyPlayer(stories,next){let s=0,f=0;function show(){if(s===stories.length)return next();let z=stories[s],frames=z.frames;G.innerHTML=`<main><h2>🎬 ${z.title}</h2><div class=story-stage><div class="actor a">${z.a}</div><div class=object>${z.o}</div><div class="actor b">${z.b}</div></div><div class=caption>${frames[f]}</div><button id=listen>🔊</button><button id=n class=next>→</button></main>`;say(frames[f]);listen.onclick=()=>say(frames[f]);n.onclick=()=>{if(f<frames.length-1){f++;show()}else{s++;f=0;show()}}}show()}const S=lang==="fr"?[{"title": "Samuel et Saül", "a": "📜", "o": "🫗", "b": "👑", "frames": ["Samuel oint Saül comme roi.", "Samuel transmet ensuite à Saül des instructions de Dieu.", "Saül désobéit.", "Samuel lui annonce que son règne ne subsistera pas."], "prophet": "Samuel", "king": "Saül"}, {"title": "Samuel et David", "a": "📜", "o": "🫗", "b": "🧑", "frames": ["Dieu envoie Samuel dans la famille d’Isaï.", "Samuel voit plusieurs fils.", "Dieu lui indique David.", "Samuel oint David."], "prophet": "Samuel", "king": "David"}, {"title": "Nathan et David", "a": "📜", "o": "🐑", "b": "👑", "frames": ["David commet un grave péché.", "Nathan vient auprès du roi et raconte l’histoire d’une petite brebis.", "David comprend qu’il est concerné.", "Nathan confronte David, et David reconnaît son péché."], "prophet": "Nathan", "king": "David"}, {"title": "Élie et Achab", "a": "📜", "o": "🔥", "b": "👑", "frames": ["Achab règne sur Israël et favorise le culte de Baal.", "Élie confronte le roi et les prophètes de Baal.", "Sur le mont Carmel, Élie appelle le peuple à choisir qui il servira.", "Le feu tombe et le peuple reconnaît le Seigneur."], "prophet": "Élie", "king": "Achab"}, {"title": "Ésaïe et Ézéchias", "a": "📜", "o": "🙏", "b": "👑", "frames": ["Ézéchias tombe gravement malade.", "Le prophète Ésaïe vient lui transmettre un message.", "Ézéchias prie et pleure.", "Ésaïe revient avec un message concernant sa guérison."], "prophet": "Ésaïe", "king": "Ézéchias"}, {"title": "Jérémie et Sédécias", "a": "📜", "o": "🏙️", "b": "👑", "frames": ["Jérémie avertit Juda pendant une période très difficile.", "Le roi Sédécias l’interroge à plusieurs reprises.", "Jérémie transmet un message difficile concernant Jérusalem.", "Le roi n’obéit pas pleinement au message."], "prophet": "Jérémie", "king": "Sédécias"}]:[{"title": "Samuel und Saul", "a": "📜", "o": "🫗", "b": "👑", "frames": ["Samuel salbt Saul zum König.", "Später übermittelt Samuel Saul Anweisungen Gottes.", "Saul gehorcht nicht.", "Samuel kündigt ihm an, dass sein Königtum keinen Bestand haben wird."], "prophet": "Samuel", "king": "Saul"}, {"title": "Samuel und David", "a": "📜", "o": "🫗", "b": "🧑", "frames": ["Gott sendet Samuel zur Familie Isais.", "Samuel sieht mehrere Söhne.", "Gott weist ihn auf David hin.", "Samuel salbt David."], "prophet": "Samuel", "king": "David"}, {"title": "Nathan und David", "a": "📜", "o": "🐑", "b": "👑", "frames": ["David begeht eine schwere Sünde.", "Nathan kommt zum König und erzählt von einem kleinen Lamm.", "David erkennt, dass die Geschichte ihn betrifft.", "Nathan stellt David zur Rede, und David bekennt seine Sünde."], "prophet": "Nathan", "king": "David"}, {"title": "Elia und Ahab", "a": "📜", "o": "🔥", "b": "👑", "frames": ["Ahab regiert Israel und fördert den Baalskult.", "Elia tritt Ahab und den Baalspropheten entgegen.", "Auf dem Karmel fordert Elia das Volk zur Entscheidung auf.", "Feuer fällt herab, und das Volk bekennt den Herrn."], "prophet": "Elia", "king": "Ahab"}, {"title": "Jesaja und Hiskia", "a": "📜", "o": "🙏", "b": "👑", "frames": ["Hiskia wird schwer krank.", "Der Prophet Jesaja bringt ihm eine Botschaft.", "Hiskia betet und weint.", "Jesaja kehrt mit einer Botschaft über seine Heilung zurück."], "prophet": "Jesaja", "king": "Hiskia"}, {"title": "Jeremia und Zedekia", "a": "📜", "o": "🏙️", "b": "👑", "frames": ["Jeremia warnt Juda in einer sehr schweren Zeit.", "König Zedekia befragt ihn mehrmals.", "Jeremia überbringt eine schwierige Botschaft über Jerusalem.", "Der König folgt der Botschaft nicht vollständig."], "prophet": "Jeremia", "king": "Zedekia"}];function start(){storyPlayer(S,memory)}function memory(){let pairs=sh(S.flatMap((x,j)=>[{j,t:"📜 "+x.prophet},{j,t:"👑 "+x.king}])),op=[],done=new Set(),lock=false;function draw(){if(done.size===S.length)return quiz();G.innerHTML=`<main><h2>🧠 ${lang==="fr"?"Prophète ↔ Roi":"Prophet ↔ König"}</h2><div class=memory-grid>${pairs.map((c,k)=>`<button data-k="${k}" class="memory-card ${done.has(c.j)?"done":op.includes(k)?"open":""}">${done.has(c.j)||op.includes(k)?c.t:"❓"}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>flip(+b.dataset.k))}function flip(k){if(lock||op.includes(k)||done.has(pairs[k].j))return;op.push(k);draw();if(op.length===2){lock=true;setTimeout(()=>{if(pairs[op[0]].j===pairs[op[1]].j)done.add(pairs[op[0]].j);op=[];lock=false;draw()},650)}}draw()}function quiz(){let q=0;function ask(){if(q===5)return reward(lang==="fr"?"Prophètes et rois maîtrisés !":"Propheten und Könige gemeistert!","📜");let z=S[Math.floor(Math.random()*S.length)],askKing=Math.random()<.5,correct=askKing?z.king:z.prophet,pool=[...new Set(S.map(x=>askKing?x.king:x.prophet))],opts=sh([correct,...sh(pool.filter(x=>x!==correct)).slice(0,3)]);G.innerHTML=`<main><h2>❓ ${q+1}/5</h2><p>${askKing?(lang==="fr"?`Avec quel roi cette histoire de ${z.prophet} est-elle liée ?`:`Mit welchem König ist diese Geschichte von ${z.prophet} verbunden?`):(lang==="fr"?`Quel prophète intervient dans cette histoire avec ${z.king} ?`:`Welcher Prophet tritt in dieser Geschichte mit ${z.king} auf?`)}</p><div class=grid>${opts.map((x,i)=>`<button data-i="${i}" class=choice>${x}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-i]").forEach((b,i)=>b.onclick=()=>{if(opts[i]!==correct)return;q++;ask()})}ask()}start();</script></body></html>
