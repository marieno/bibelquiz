<meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#123e69;background:linear-gradient(#ccefff,#fff2bf);min-height:100vh}main{max-width:900px;margin:auto;padding:14px}button{border:0;border-radius:15px;padding:13px;font-weight:850;color:#123e69}.card{background:#fff;border-radius:20px;padding:16px;margin:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{background:#fff;min-height:90px}.scene{font-size:90px;text-align:center;background:#fff8;border-radius:25px;padding:24px}.next{display:block;width:90%;margin:14px auto;background:#49ca68;color:white}.reward{text-align:center;background:#fff;border-radius:25px;padding:25px}.balloon-stage{height:58vh;position:relative;overflow:hidden;background:#9de3ff;border-radius:24px}.balloon{position:absolute;top:-130px;width:115px;min-height:125px;border-radius:55%;background:#fff;border:4px solid #69a8d5;animation:fall 8s linear forwards}@keyframes fall{to{top:105%}}.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kingdom{padding:15px;border-radius:22px;min-height:220px}.north{background:#bde5ff}.south{background:#ffd8a8}@media(max-width:600px){.map{grid-template-columns:1fr}}</style><div id=game></div><script>const lang=localStorage.getItem("bibelquiz_language")==="fr"?"fr":"de",G=document.getElementById("game"),sh=a=>[...a].sort(()=>Math.random()-.5);let lives=3,reserve=Number(localStorage.getItem("bq_reserve_hearts")||0);function hud(){return "❤️".repeat(lives)+" 🟡"+reserve}function say(x){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(x));u.lang=lang==="fr"?"fr-FR":"de-DE";speechSynthesis.speak(u)}function lose(retry){if(reserve>0){reserve--;localStorage.setItem("bq_reserve_hearts",reserve);return true}lives--;if(lives>0)return true;G.innerHTML=`<main><div class=reward><h1>💔 ${lang==="fr"?"Plus de vies":"Keine Leben mehr"}</h1><button id=a>${lang==="fr"?"REJOUER":"NOCH EINMAL"}</button></div></main>`;a.onclick=()=>{lives=3;retry()};return false}function reward(t,i){G.innerHTML=`<main><div class=reward><div style="font-size:90px">${i}</div><h1>${t}</h1><button onclick="location.href='/'">← BibelQuiz</button></div></main>`}const A=lang==="fr"?["Ésaïe", "Jérémie", "Ézéchiel", "Daniel"]:["Jesaja", "Jeremia", "Hesekiel", "Daniel"],B=lang==="fr"?["Osée", "Joël", "Amos", "Abdias", "Jonas", "Michée", "Nahum", "Habacuc", "Sophonie", "Aggée", "Zacharie", "Malachie"]:["Hosea", "Joel", "Amos", "Obadja", "Jona", "Micha", "Nahum", "Habakuk", "Zefanja", "Haggai", "Sacharja", "Maleachi"],X=[...A,...B];let i=0;function learn(){if(i===X.length)return test();let x=X[i],big=A.includes(x);G.innerHTML=`<main><h1>📜 ${lang==="fr"?"Prophètes":"Propheten"} · ${hud()}</h1><div class=scene>📜👤</div><div class=card><h1>${x}</h1><p>${big?(lang==="fr"?"Grand prophète":"Großer Prophet"):(lang==="fr"?"Petit prophète":"Kleiner Prophet")}</p><button id=n class=next>→</button></div></main>`;say(x);n.onclick=()=>{i++;learn()}}function test(){let list=sh(X),q=0;function ask(){if(q===list.length)return reward(lang==="fr"?"Prophètes maîtrisés !":"Propheten gemeistert!","📜");let x=list[q];G.innerHTML=`<main><h2>${x} · ${hud()}</h2><p>${lang==="fr"?"Grand/petit décrit la longueur traditionnelle des livres, pas l’importance.":"Groß/klein beschreibt traditionell die Buchlänge, nicht die Bedeutung."}</p><div class=grid><button id=a class=choice>${lang==="fr"?"GRAND":"GROSS"}</button><button id=b class=choice>${lang==="fr"?"PETIT":"KLEIN"}</button></div></main>`;a.onclick=()=>pick(1);b.onclick=()=>pick(0);function pick(v){if(Boolean(v)!==A.includes(x)){lose(test);return}q++;ask()}}ask()}learn();</script>
