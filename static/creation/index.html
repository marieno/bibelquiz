<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#123e69;background:linear-gradient(#ccefff,#fff2bf);min-height:100vh}main{max-width:920px;margin:auto;padding:14px}header{display:flex;align-items:center;justify-content:space-between}button{border:0;border-radius:15px;padding:13px;font-weight:900;color:#123e69}.progress{height:17px;background:#dce9ef;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#49c969}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{background:#fff;min-height:70px;box-shadow:0 4px 12px #0002}.scene{min-height:44vh;border-radius:27px;margin:12px 0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:20px}.toast{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);background:#173d5d;color:white;padding:13px;border-radius:18px;z-index:99;font-weight:900}.reward{text-align:center;background:#fff8;border-radius:28px;padding:24px}.badge{font-size:90px}.stars{font-size:42px}.phase{display:inline-block;background:#fff;padding:8px 12px;border-radius:14px;font-weight:900;margin:8px}.hearts{text-align:center;font-size:28px}.card{text-align:center;background:#fff;padding:18px;border-radius:20px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}.themed{background:linear-gradient(#7ed8ff,#7bc65d)}.sceneIcon{font-size:150px}.next-btn{display:block;width:min(92%,520px);margin:18px auto;padding:18px 20px!important;background:#48c965!important;color:#fff!important;font-size:18px!important}.correct-reveal{background:#dff8e5;border:3px solid #48c965;border-radius:17px;padding:14px;margin:12px;text-align:center}.learning-help{background:#fff8;border-radius:15px;padding:10px} .creation-scene{text-align:center;font-size:110px;background:#fff8;border-radius:22px;padding:22px}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memory-card{min-height:90px;background:#164d7b;color:#fff}.memory-card.open,.memory-card.done{background:#fff;color:#123e69}.sort-list{max-width:650px;margin:auto}@media(max-width:600px){.memory-grid{grid-template-columns:repeat(3,1fr)}}.lives{font-size:25px;background:#fff;padding:7px 11px;border-radius:13px}.gameover,.bonus-box{background:#fff;border-radius:24px;padding:22px;text-align:center}.sort-list{display:flex;flex-direction:column;gap:8px}.sort-item{background:#fff;padding:13px;border-radius:13px;display:flex;justify-content:space-between}.quiz-progress{text-align:center;font-weight:900;margin:10px}.visual-strip{display:flex;gap:8px;overflow-x:auto;padding:10px 2px}.visual-card{flex:0 0 125px;min-height:125px;background:#fff;border-radius:18px;padding:10px;text-align:center;display:grid;place-items:center;box-shadow:0 4px 10px #0002}.visual-card .ico{font-size:42px}.visual-card.hidden{border:4px dashed #f0b62d;background:#fff3bd;font-size:48px}.visual-card small{display:block;font-weight:800}.reveal-pop{animation:revealPop .45s ease}@keyframes revealPop{0%{transform:scale(.3) rotate(-8deg)}75%{transform:scale(1.12)}100%{transform:scale(1)}}</style></head><body><div id=game></div><script src="/static/bq-lives.js"></script><script>const lang=localStorage.getItem("bibelquiz_language")==="fr"?"fr":"de",G=document.getElementById("game"),sh=a=>[...a].sort(()=>Math.random()-.5),D=lang==="fr"?["Lumière", "Ciel", "Terre, mers et plantes", "Soleil, lune et étoiles", "Poissons et oiseaux", "Animaux terrestres et êtres humains", "Repos"]:["Licht", "Himmel", "Land, Meer und Pflanzen", "Sonne, Mond und Sterne", "Fische und Vögel", "Landtiere und Menschen", "Ruhetag"],I=["💡", "☁️", "🌿", "☀️🌙⭐", "🐟🐦", "🦁🧑", "😌"];let n=0;
function say(x){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x);u.lang=lang==="fr"?"fr-FR":"de-DE";speechSynthesis.speak(u)}}
function bonus(next){let qs=sh([...Array(7).keys()]).slice(0,3),q=0,won=0;function ask(){if(q===3){BQLives.reset(won||1);G.innerHTML=`<main><div class=bonus-box><h1>❤️ ${won}/3</h1><button id=go>${lang==="fr"?"CONTINUER":"WEITER"}</button></div></main>`;go.onclick=next;return}let t=qs[q],o=sh([t,...sh([...Array(7).keys()].filter(i=>i!==t)).slice(0,2)]);G.innerHTML=`<main><h2>❤️ BONUS ${q+1}/3</h2><p>${lang==="fr"?`Que correspond au jour ${t+1} ?`:`Was gehört zum ${t+1}. Tag?`}</p><div class=grid>${o.map(i=>`<button data-i="${i}" class=choice>${I[i]} ${D[i]}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{if(+b.dataset.i===t)won++;q++;ask()})}ask()}
function lose(retry){return BQLives.lose(retry,()=>bonus(retry))}
function learn(){if(n===7)return dayQuiz();G.innerHTML=`<main><h2>🌍 ${lang==="fr"?"Création":"Schöpfung"} <span class=lives>${BQLives.html()}</span></h2><div class=creation-scene>${I[n]}</div><h1>${n+1}. ${D[n]}</h1><button id=s>🔊</button><button id=nx class=next-btn>→</button></main>`;say(D[n]);s.onclick=()=>say(D[n]);nx.onclick=()=>{n++;learn()}}
function dayQuiz(){let q=0;function ask(){if(q===7)return memory();let o=sh([q,...sh([...Array(7).keys()].filter(i=>i!==q)).slice(0,2)]);G.innerHTML=`<main><h2><span class=lives>${BQLives.html()}</span> ${lang==="fr"?`Qu’est-ce que Dieu créa au jour ${q+1} ?`:`Was hat Gott am ${q+1}. Tag erschaffen?`}</h2><div class=visual-strip>${D.map((x,i)=>`<div class="visual-card ${i===q?"hidden":""}"><div class=ico>${i===q?"❓":I[i]}</div><small>${i+1}. ${i===q?"?":x}</small></div>`).join("")}</div><div class=grid>${o.map(i=>`<button data-i="${i}" class=choice>${I[i]} ${D[i]}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{if(+b.dataset.i!==q){lose(dayQuiz);return}q++;ask()})}ask()}
function memory(){
 let cards=sh(D.flatMap((x,i)=>[{i,t:(i+1)+". "+(lang==="fr"?"Jour":"Tag")},{i,t:I[i]+" "+x}])),op=[],done=new Set(),lock=false,time=30,timer=null,paused=false;
 function startTimer(){clearInterval(timer);time=30;paused=false;timer=setInterval(()=>{time--;let el=document.getElementById("memTime");if(el)el.textContent=String(time).padStart(2,"0");if(time<=0){clearInterval(timer);paused=true;memoryTimeout()}},1000)}
 function draw(first=false){if(done.size===7){clearInterval(timer);return sorting()}G.innerHTML=`<main><h2>🧠 Memory <span class=lives>${BQLives.html()}</span> ⏱️ 00:<span id=memTime>${String(time).padStart(2,"0")}</span></h2><p>${lang==="fr"?"Trouve les 7 paires. Une mauvaise paire ne coûte aucune vie.":"Finde die 7 Paare. Ein falsches Paar kostet kein Leben."}</p><div class=memory-grid>${cards.map((c,k)=>`<button data-k="${k}" class="memory-card ${done.has(c.i)?"done":op.includes(k)?"open":""}">${done.has(c.i)||op.includes(k)?c.t:"❓"}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>flip(+b.dataset.k));if(first)startTimer()}
 function flip(k){if(paused||lock||op.includes(k)||done.has(cards[k].i))return;op.push(k);draw();if(op.length===2){lock=true;setTimeout(()=>{let a=cards[op[0]],b=cards[op[1]];if(a.i===b.i)done.add(a.i);op=[];lock=false;draw()},700)}}
 function memoryTimeout(){if(done.size===7)return sorting();let alive=BQLives.lose(()=>{cards=sh(D.flatMap((x,i)=>[{i,t:(i+1)+". "+(lang==="fr"?"Jour":"Tag")},{i,t:I[i]+" "+x}]));op=[];done=new Set();lock=false;draw(true)},()=>bonus(()=>memory()));if(!alive)return;G.innerHTML=`<main><div class=gameover><h1>⏰ ${lang==="fr"?"Temps écoulé !":"Zeit vorbei!"}</h1><p>${BQLives.html()}</p><p>${lang==="fr"?"Les paires déjà trouvées restent ouvertes.":"Die bereits gefundenen Paare bleiben offen."}</p><button id=continueMem>${lang==="fr"?"CONTINUER — 30 s":"WEITERMACHEN — 30 s"}</button></div></main>`;document.getElementById("continueMem").onclick=()=>{op=[];lock=false;draw();startTimer()}}
 draw(true)
}
function sorting(){let arr=sh([...Array(7).keys()]);function draw(){G.innerHTML=`<main><h2>🧩 ${lang==="fr"?"Mets les jours dans le bon ordre":"Bringe die Tage in die richtige Reihenfolge"} <span class=lives>${BQLives.html()}</span></h2><div class=sort-list>${arr.map((i,k)=>`<div class=sort-item>${I[i]} ${D[i]}<span><button data-u="${k}">⬆️</button><button data-d="${k}">⬇️</button></span></div>`).join("")}</div><button id=ok class=next-btn>✓</button></main>`;document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{let k=+b.dataset.u;if(k){[arr[k-1],arr[k]]=[arr[k],arr[k-1]];draw()}});document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{let k=+b.dataset.d;if(k<6){[arr[k+1],arr[k]]=[arr[k],arr[k+1]];draw()}});ok.onclick=()=>{if(arr.every((x,i)=>x===i))themeQuiz();else lose(sorting)}}draw()}
function themeQuiz(){let q=0;function ask(){if(q===5){G.innerHTML=`<main><div class=reward><h1>🥇 ${lang==="fr"?"Création maîtrisée !":"Schöpfung gemeistert!"}</h1><button onclick="location.href='/'">BibelQuiz</button></div></main>`;return}let t=Math.floor(Math.random()*7),o=sh([t,...sh([...Array(7).keys()].filter(i=>i!==t)).slice(0,2)]);G.innerHTML=`<main><h2>❓ QUIZ ${q+1}/5 <span class=lives>${BQLives.html()}</span></h2><p>${lang==="fr"?`Que correspond au jour ${t+1} ?`:`Was gehört zum ${t+1}. Tag?`}</p><div class=grid>${o.map(i=>`<button data-i="${i}" class=choice>${D[i]}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{if(+b.dataset.i!==t){lose(themeQuiz);return}q++;ask()})}ask()}learn();</script></body></html>
