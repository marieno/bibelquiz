<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store"><title>BibelQuiz V11.0.6 disciples</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#123e69;background:linear-gradient(#ccefff,#fff2bf);min-height:100vh}main{max-width:900px;margin:auto;padding:14px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}button{border:0;border-radius:15px;padding:13px;font-weight:900;color:#123e69}.progress{height:18px;background:#dce9ef;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#48c965}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{background:#fff;min-height:72px;font-size:16px;box-shadow:0 4px 12px #0002}.scene{position:relative;min-height:52vh;border-radius:28px;overflow:hidden}.toast{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);background:#173d5d;color:#fff;padding:13px 18px;border-radius:18px;z-index:99;font-weight:900}.reward{text-align:center;background:#fff8;border-radius:28px;padding:24px}.big{font-size:95px}.stars{font-size:42px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}.themed{background:linear-gradient(#80d8ff 0 60%,#7ac45d 60%);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px}.themed>div{width:100%;text-align:center;font-size:100px}.themed span{background:#fff9;border-radius:12px;padding:8px;font-weight:900}.phase{display:inline-block;background:#fff;padding:8px 12px;border-radius:14px;font-weight:900}.hearts{text-align:center;font-size:28px}.themed{background:linear-gradient(#7ed8ff,#7bc65d);display:flex;align-items:center;justify-content:center}.sceneIcon{font-size:145px}.badge{font-size:90px}.next-btn{display:block;width:min(92%,520px);margin:18px auto;padding:18px 20px!important;background:#48c965!important;color:#fff!important;font-size:18px!important}.correct-reveal{background:#dff8e5;border:3px solid #48c965;border-radius:17px;padding:14px;margin:12px;text-align:center}.learning-help{background:#fff8;border-radius:15px;padding:10px}.memory-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}.memory-person{background:#fff;border-radius:17px;padding:14px;min-width:125px;text-align:center;font-size:28px;box-shadow:0 5px 12px #0002}.memory-person b{display:block;font-size:14px;margin-top:6px}.missing-person{border:4px dashed #f0b92d;background:#fff4bd}.countdown{text-align:center;font-size:70px;font-weight:1000;color:#e05d32}.master-top{display:flex;justify-content:space-between}.scorebox,.instruction,.preview{background:#fff;padding:10px;border-radius:12px}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memory-card{min-height:100px;background:#164d7b;color:#fff}.memory-card.open,.memory-card.done{background:#fff;color:#123e69}.token-bank,.preview-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.token{background:#fff;padding:11px}.token.selected{outline:5px solid #ffd343}.dropzone{border:5px dashed #fff;background:#fff6;border-radius:24px;padding:12px;text-align:center}.tree{font-size:170px}.soldier{text-align:center;font-size:160px}.countdown{text-align:center;font-size:60px}.boat-scene,.camp-scene{min-height:240px;border-radius:24px;display:grid;place-items:center;font-size:80px}.boat-scene{background:#68ccef}.camp-scene{background:#dfc47c}.master-end{text-align:center;background:#fff;padding:24px;border-radius:24px}.medal{font-size:90px}.next-btn{display:block;width:90%;margin:15px auto;background:#48c965!important;color:#fff!important}@media(max-width:600px){.memory-grid{grid-template-columns:repeat(3,1fr)}}
.draggable{touch-action:none;cursor:grab}.dragging{opacity:.55;transform:scale(1.08)}
.drop-active{outline:6px solid #ffd54f}
.balloon-stage{position:relative;height:62vh;overflow:hidden;border-radius:25px;background:linear-gradient(#86dcff,#e7f8ff)}
.balloon{position:absolute;width:115px;min-height:135px;border-radius:55% 55% 48% 48%;background:#fff;border:4px solid #69a8d5;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-weight:900;box-shadow:0 6px 14px #0002;animation:floatDown 8s linear forwards}
.balloon:after{content:"";position:absolute;bottom:-22px;width:2px;height:22px;background:#555}
@keyframes floatDown{from{top:-150px}to{top:105%}}
.equip-person{position:relative;width:230px;height:350px;margin:auto}.equip-person .body{font-size:210px;position:absolute;inset:45px 0 0;text-align:center}.worn{position:absolute;z-index:3;font-size:52px}.worn.head{top:18px;left:89px}.worn.left{top:145px;left:25px}.worn.right{top:145px;right:22px}.worn.waist{top:190px;left:92px}.worn.chest{top:112px;left:90px}.worn.feet{bottom:5px;left:83px}
.memory-scene{font-size:34px;min-height:100px;display:grid;place-items:center}
</style></head><body><div id="game"><main><div class="card"><h2>🔵 HTML V11.0.6 chargé</h2><p>disciples</p></div></main></div><script>
(function(){
  var root=document.getElementById("game");
  function show(msg,detail){
    if(!root)return;
    root.innerHTML='<main><div class="card"><h2>'+msg+'</h2>'+(detail?'<pre style="white-space:pre-wrap;text-align:left">'+String(detail).replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</pre>':'')+'<button data-home="1">← BibelQuiz</button></div></main>';
  }
  show("✅ BOOT HTML V11.0.6","disciples");
  window.addEventListener("error",function(e){show("⚠️ ERREUR JAVASCRIPT", (e.message||"Erreur")+" @ "+(e.filename||"inline")+":"+(e.lineno||0)+":"+(e.colno||0));});
  setTimeout(function(){
    try{
      const lang=localStorage.getItem("bibelquiz_language")==="fr"?"fr":"de",G=document.getElementById("game"),sh=a=>[...a].sort(()=>Math.random()-.5);let score=0,maxScore=0;function say(x){if(!("speechSynthesis"in window))return;let u=new SpeechSynthesisUtterance(String(x));u.lang=lang==="fr"?"fr-FR":"de-DE";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}function toast(x){let d=document.createElement("div");d.className="toast";d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}function top(t,p){return `<header><button data-home="1">← BibelQuiz</button><h2>${t}</h2></header><div class=master-top><b>${p}</b><span class=scorebox>⭐ ${score}/${maxScore}</span></div>`}function good(){score++;maxScore++;toast("✨ +1 ⭐")}function bad(){maxScore++;toast(lang==="fr"?"Essaie encore 😊":"Versuch es noch einmal 😊")}function finish(t,i){let p=maxScore?score/maxScore:1,m=p>=.85?"🥇":p>=.65?"🥈":"🥉";G.innerHTML=`<main><div class=master-end><div class=medal>${m}</div><h1>${i} ${t}</h1><p>⭐ ${score}/${maxScore}</p><button data-reload="1">🔄</button> <button data-home="1">← BibelQuiz</button></div></main>`}const X=lang==="fr"?["Pierre", "André", "Jacques", "Jean", "Philippe", "Barthélemy", "Matthieu", "Thomas", "Jacques, fils d’Alphée", "Thaddée", "Simon le Zélote", "Judas Iscariot"]:["Petrus", "Andreas", "Jakobus", "Johannes", "Philippus", "Bartholomäus", "Matthäus", "Thomas", "Jakobus, Sohn des Alphäus", "Thaddäus", "Simon der Zelot", "Judas Iskariot"];let n=0;
function learn(){if(n===X.length)return memory();G.innerHTML=`<main>${top(lang==="fr"?"12 disciples":"12 J\u00fcnger","1. "+(lang==="fr"?"DÉCOUVRIR":"ENTDECKEN"))}<div class="boat-scene">🎣</div><div class=card><h1>🎣 ${X[n]}</h1><button data-act="speakCurrent">🔊</button><button class=next-btn data-act="nextLearn">→</button></div></main>`}
function memory(){let p=sh([...Array(X.length).keys()]).slice(0,5),h=p[Math.floor(Math.random()*5)];window.p=p;window.h=h;G.innerHTML=`<main>${top(lang==="fr"?"12 disciples":"12 J\u00fcnger","👀 MEMORY")}<div class=instruction>${lang==="fr"?"Mémorise ces 5 noms.":"Merke dir diese 5 Namen."}</div><div class=preview-row>${p.map(i=>`<div class=preview>🎣<br>${X[i]}</div>`).join("")}</div><div id=cd class=countdown>5</div></main>`;let c=5,t=setInterval(()=>{c--;document.getElementById("cd").textContent=c;if(c<=0){clearInterval(t);question()}},650)}
function question(){let shown=p.filter(i=>i!==h),o=sh([h,...sh([...Array(X.length).keys()].filter(i=>!p.includes(i))).slice(0,3)]);G.innerHTML=`<main>${top(lang==="fr"?"12 disciples":"12 J\u00fcnger",lang==="fr"?"QUI A DISPARU ?":"WER IST VERSCHWUNDEN?")}<div class=preview-row>${shown.map(i=>`<div class=preview>${X[i]}</div>`).join("")}<div class=preview>❓</div></div><div class=grid>${o.map(i=>`<button class=choice data-act="mem" data-i="${i}">${X[i]}</button>`).join("")}</div></main>`}
function mem(i){if(i!==h)return bad();good();odd()}
function odd(){let b=lang==="fr"?"Mo\u00efse":"Mose",o=sh([0,1,2,-1]);G.innerHTML=`<main>${top(lang==="fr"?"12 disciples":"12 J\u00fcnger","🕵️ INTRUS")}<div class=grid>${o.map(i=>`<button class=choice data-act="odd" data-i="${i}">${i<0?b:X[i]}</button>`).join("")}</div></main>`}
function op(i){if(i!==-1)return bad();good();recognize()}
function recognize(){let r=0;function q(){if(r===5)return balloons();let t=Math.floor(Math.random()*X.length),o=sh([t,...sh([...Array(X.length).keys()].filter(i=>i!==t)).slice(0,3)]);G.innerHTML=`<main>${top(lang==="fr"?"12 disciples":"12 J\u00fcnger","🔊 "+(lang==="fr"?"RECONNAÎTRE":"ERKENNEN"))}<button data-act="speakTarget" data-i="${t}">🔊</button><div class=grid>${o.map(i=>`<button class=choice data-act="rec" data-i="${i}" data-t="${t}">${X[i]}</button>`).join("")}</div></main>`;say(X[t]);window.rec=(i,t)=>{if(i!==t)return bad();good();r++;q()}}q()}
window.say=say;window.learn=learn;window.mem=mem;window.op=op;
document.addEventListener("click",function(e){let b=e.target.closest("button");if(!b)return;if(b.dataset.home){location.href="/";return}if(b.dataset.reload){location.reload();return}let a=b.dataset.act;if(a==="speakCurrent")say(X[n]);else if(a==="nextLearn"){n++;learn()}else if(a==="mem")mem(Number(b.dataset.i));else if(a==="odd")op(Number(b.dataset.i));else if(a==="speakTarget")say(X[Number(b.dataset.i)]);else if(a==="rec")window.rec(Number(b.dataset.i),Number(b.dataset.t))});

function balloons(){
 let goodNames=sh([...X]).slice(0,7),badNames=lang==="fr"?["Moïse", "Abraham", "David", "Paul"]:["Mose", "Abraham", "David", "Paulus"],items=sh([...goodNames.map(x=>({x,ok:1})),...badNames.map(x=>({x,ok:0}))]),hit=0;
 G.innerHTML=`<main>${top(lang==="fr"?"12 disciples":"12 J\u00fcnger","🎈 BALLOONS")}<div class=instruction>${lang==="fr"?"Éclate uniquement les ballons qui appartiennent à cette rubrique !":"Zerplatze nur die Ballons, die zu dieser Rubrik gehören!"}</div><div class=balloon-stage id=bs></div></main>`;
 let st=document.getElementById("bs");
 items.forEach((o,i)=>{let b=document.createElement("button");b.className="balloon";b.textContent=o.x;b.style.left=(5+(i*17)%75)+"%";b.style.animationDelay=(i*.45)+"s";b.onclick=()=>{if(o.ok){good();hit++;b.remove();if(hit===goodNames.length)setTimeout(()=>finish(lang==="fr"?"12 disciples":"12 J\u00fcnger","\ud83c\udf88"),350)}else{bad();b.animate?.([{transform:"translateX(-8px)"},{transform:"translateX(8px)"},{transform:"translateX(0)"}],{duration:250})}};b.addEventListener("animationend",()=>{if(!b.isConnected)return;b.style.animation="none";void b.offsetHeight;b.style.left=(5+Math.floor(Math.random()*75))+"%";b.style.animation="floatDown 8s linear forwards"});st.appendChild(b)});
}
learn();
    }catch(e){
      show("⚠️ ERREUR AU DÉMARRAGE", (e&&e.name?e.name+": ":"")+(e&&e.message?e.message:String(e))+(e&&e.stack?"\n"+e.stack:""));
    }
  },0);
})();
</script></body></html>
