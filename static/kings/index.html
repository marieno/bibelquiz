<meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#123e69;background:linear-gradient(#ccefff,#fff2bf);min-height:100vh}main{max-width:900px;margin:auto;padding:14px}button{border:0;border-radius:15px;padding:13px;font-weight:850;color:#123e69}.card{background:#fff;border-radius:20px;padding:16px;margin:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{background:#fff;min-height:90px}.scene{font-size:90px;text-align:center;background:#fff8;border-radius:25px;padding:24px}.next{display:block;width:90%;margin:14px auto;background:#49ca68;color:white}.reward{text-align:center;background:#fff;border-radius:25px;padding:25px}.balloon-stage{height:58vh;position:relative;overflow:hidden;background:#9de3ff;border-radius:24px}.balloon{position:absolute;top:-130px;width:115px;min-height:125px;border-radius:55%;background:#fff;border:4px solid #69a8d5;animation:fall 8s linear forwards}@keyframes fall{to{top:105%}}.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kingdom{padding:15px;border-radius:22px;min-height:220px}.north{background:#bde5ff}.south{background:#ffd8a8}@media(max-width:600px){.map{grid-template-columns:1fr}}</style><div id=game></div><script>const lang=localStorage.getItem("bibelquiz_language")==="fr"?"fr":"de",G=document.getElementById("game"),sh=a=>[...a].sort(()=>Math.random()-.5);let lives=3,reserve=Number(localStorage.getItem("bq_reserve_hearts")||0);function hud(){return "❤️".repeat(lives)+" 🟡"+reserve}function say(x){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(x));u.lang=lang==="fr"?"fr-FR":"de-DE";speechSynthesis.speak(u)}function lose(retry){if(reserve>0){reserve--;localStorage.setItem("bq_reserve_hearts",reserve);return true}lives--;if(lives>0)return true;G.innerHTML=`<main><div class=reward><h1>💔 ${lang==="fr"?"Plus de vies":"Keine Leben mehr"}</h1><button id=a>${lang==="fr"?"REJOUER":"NOCH EINMAL"}</button></div></main>`;a.onclick=()=>{lives=3;retry()};return false}function reward(t,i){G.innerHTML=`<main><div class=reward><div style="font-size:90px">${i}</div><h1>${t}</h1><button onclick="location.href='/'">← BibelQuiz</button></div></main>`}const K=lang==="fr"?[["Saül", "Premier roi d’Israël"], ["David", "Roi associé à Jérusalem et à la lignée royale"], ["Salomon", "Connu pour sa sagesse et le Temple"], ["Roboam", "Sous son règne, le royaume se divise"], ["Jéroboam", "Premier roi du royaume du Nord après la division"], ["Ézéchias", "Roi de Juda"], ["Josias", "Roi de Juda associé à une grande réforme"]]:[["Saul", "Erster König Israels"], ["David", "König, verbunden mit Jerusalem und der Königslinie"], ["Salomo", "Bekannt für Weisheit und den Tempel"], ["Rehabeam", "Unter ihm teilt sich das Reich"], ["Jerobeam", "Erster König des Nordreichs nach der Teilung"], ["Hiskia", "König von Juda"], ["Josia", "König von Juda, verbunden mit einer großen Reform"]];let i=0;function learn(){if(i===K.length)return kingdoms();let x=K[i];G.innerHTML=`<main><h1>👑 ${lang==="fr"?"Rois":"Könige"} · ${hud()}</h1><div class=scene>👑</div><div class=card><h1>${x[0]}</h1><p>${x[1]}</p><button id=n class=next>→</button></div></main>`;say(x[0]+". "+x[1]);n.onclick=()=>{i++;learn()}}function kingdoms(){G.innerHTML=`<main><h1>🗺️ ${lang==="fr"?"Les royaumes":"Die Reiche"}</h1><div class=card><h2>${lang==="fr"?"Royaume uni":"Vereinigtes Königreich"}</h2><p>👑 ${lang==="fr"?"Saül → David → Salomon":"Saul → David → Salomo"}</p></div><div class=map><div class="kingdom north"><h2>⬆️ ${lang==="fr"?"Israël — Nord":"Israel — Nord"}</h2><p>${lang==="fr"?"Après la division : Jéroboam devient le premier roi du Nord.":"Nach der Teilung wird Jerobeam erster König des Nordreichs."}</p></div><div class="kingdom south"><h2>⬇️ ${lang==="fr"?"Juda — Sud":"Juda — Süd"}</h2><p>${lang==="fr"?"Roboam règne sur Juda. Plus tard : Ézéchias, Josias…":"Rehabeam regiert Juda. Später: Hiskia, Josia…"}</p></div></div><button id=n class=next>QUIZ →</button></main>`;n.onclick=quiz}function quiz(){let q=0;function ask(){if(q===5)return reward(lang==="fr"?"Rois et royaumes maîtrisés !":"Könige und Reiche gemeistert!","👑");let t=K[Math.floor(Math.random()*K.length)],o=sh([t,...sh(K.filter(x=>x[0]!==t[0])).slice(0,3)]);G.innerHTML=`<main><h2>❓ ${q+1}/5 · ${hud()}</h2><p>${t[1]}</p><div class=grid>${o.map((x,k)=>`<button data-k="${k}" class=choice>${x[0]}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-k]").forEach((b,k)=>b.onclick=()=>{if(o[k][0]!==t[0]){lose(quiz);return}q++;ask()})}ask()}learn();</script>
