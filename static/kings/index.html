<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#123e69;background:linear-gradient(#ccefff,#fff1bf);min-height:100vh}main{max-width:900px;margin:auto;padding:14px}button{border:0;border-radius:15px;padding:13px;font-weight:850;color:#123e69}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice,.card{background:#fff;min-height:90px}.card{border-radius:20px;padding:16px;margin:10px 0}.story-stage{height:280px;border-radius:24px;background:linear-gradient(#8bdcff 0 62%,#8fca6e 62%);position:relative;overflow:hidden}.actor{position:absolute;bottom:30px;font-size:75px}.a{left:16%}.b{right:16%}.object{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:78px}.caption{background:#fff;border-radius:18px;padding:15px;font-size:19px;font-weight:800;margin:10px 0}.next{display:block;width:90%;margin:12px auto;background:#49c969;color:white}.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kingdom{border-radius:22px;padding:14px}.north{background:#bce5ff}.south{background:#ffd8a8}.timeline{display:grid;grid-template-columns:1fr 1fr;gap:10px}.timeline .lane{background:#fff8;padding:12px;border-radius:18px}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memory-card{min-height:90px;background:#164d7b;color:#fff}.memory-card.open,.memory-card.done{background:#fff;color:#123e69}.reward{text-align:center;background:#fff;border-radius:25px;padding:25px}.goodking{border:4px solid #52b76b}.badking{border:4px solid #dc6666}.bq-music{position:fixed;right:10px;bottom:10px;z-index:9999}.bq-music button{background:#fff}@media(max-width:600px){.map,.timeline{grid-template-columns:1fr}.memory-grid{grid-template-columns:repeat(3,1fr)}}.bq-global-lives{position:fixed;left:10px;bottom:10px;z-index:9998;background:#fff;padding:8px 10px;border-radius:14px;font-weight:900}.bq-reserve{color:#9a7300}</style><script src="/static/bq-audio.js"></script><script src="/static/bq-lives-v17.js"></script><script src="/static/bq-lives-hud.js"></script></head><body><div id=game></div><script>function lose(retry){return BQLives.lose(retry)}
const lang=localStorage.getItem("bibelquiz_language")==="fr"?"fr":"de",G=document.getElementById("game"),sh=a=>[...a].sort(()=>Math.random()-.5);function say(x){if(window.BQAudio)return BQAudio.speak(x)}function reward(t,i){G.innerHTML=`<main><div class=reward><div style="font-size:90px">${i}</div><h1>${t}</h1><button onclick="location.href='/'">← BibelQuiz</button></div></main>`}function storyPlayer(stories,next){let s=0,f=0;function show(){if(s===stories.length)return next();let z=stories[s],frames=z.frames;G.innerHTML=`<main><h2>🎬 ${z.title}</h2><div class=story-stage><div class="actor a">${z.a}</div><div class=object>${z.o}</div><div class="actor b">${z.b}</div></div><div class=caption>${frames[f]}</div><button id=listen>🔊</button><button id=n class=next>${f===frames.length-1?"→":"→"}</button></main>`;say(frames[f]);listen.onclick=()=>say(frames[f]);n.onclick=()=>{if(f<frames.length-1){f++;show()}else{s++;f=0;show()}}}show()}const K=lang==="fr"?[{"title": "Saül", "a": "👑", "o": "⚔️", "b": "👤", "frames": ["Saül fut le premier roi d’Israël.", "Il commença avec des responsabilités importantes.", "Mais il désobéit à des instructions de Dieu transmises par Samuel.", "Le récit montre pourquoi son règne fut finalement rejeté."], "eval": "mauvais"}, {"title": "David", "a": "👑", "o": "🎵", "b": "🙏", "frames": ["David fut choisi et oint par Samuel.", "Il devint roi et Jérusalem devint sa capitale.", "Il commit aussi de graves péchés.", "Lorsque Nathan le confronta, David reconnut son péché et se repentit."], "eval": "bon"}, {"title": "Salomon", "a": "👑", "o": "🏛️", "b": "📜", "frames": ["Salomon demanda la sagesse et construisit le Temple.", "Son règne connut une grande prospérité.", "Mais plus tard, ses femmes détournèrent son cœur vers d’autres dieux.", "Son histoire montre qu’un bon commencement ne garantit pas une bonne fin."], "eval": "nuance"}, {"title": "Roboam", "a": "👑", "o": "💔", "b": "👥", "frames": ["Après Salomon, Roboam devint roi.", "Il refusa d’alléger le fardeau du peuple.", "Le royaume se divisa.", "Roboam régna sur Juda au Sud."], "eval": "mauvais"}, {"title": "Jéroboam", "a": "👑", "o": "🐂", "b": "⬆️", "frames": ["Jéroboam devint le premier roi du royaume du Nord.", "Il installa des lieux de culte avec des veaux d’or.", "Il entraîna Israël dans un culte condamné par le récit biblique."], "eval": "mauvais"}, {"title": "Ézéchias", "a": "👑", "o": "🙏", "b": "📜", "frames": ["Ézéchias fut roi de Juda.", "Il mit sa confiance dans le Seigneur et entreprit des réformes.", "Lorsqu’il fut malade, il pria.", "Le prophète Ésaïe lui transmit un message de Dieu."], "eval": "bon"}, {"title": "Josias", "a": "👑", "o": "📖", "b": "✨", "frames": ["Josias devint roi de Juda très jeune.", "Le livre de la Loi fut retrouvé pendant les travaux du Temple.", "Josias s’humilia et conduisit une grande réforme.", "Le récit le présente comme un roi attaché à l’alliance."], "eval": "bon"}]:[{"title": "Saul", "a": "👑", "o": "⚔️", "b": "👤", "frames": ["Saul war der erste König Israels.", "Er begann mit großer Verantwortung.", "Doch er missachtete Anweisungen Gottes, die Samuel ihm überbrachte.", "Die Geschichte zeigt, warum sein Königtum schließlich verworfen wurde."], "eval": "schlecht"}, {"title": "David", "a": "👑", "o": "🎵", "b": "🙏", "frames": ["David wurde von Samuel ausgewählt und gesalbt.", "Er wurde König, und Jerusalem wurde seine Hauptstadt.", "Auch David beging schwere Sünden.", "Als Nathan ihn zur Rede stellte, bekannte David seine Sünde und bereute."], "eval": "gut"}, {"title": "Salomo", "a": "👑", "o": "🏛️", "b": "📜", "frames": ["Salomo bat um Weisheit und baute den Tempel.", "Seine Herrschaft kannte großen Wohlstand.", "Später wandten seine Frauen sein Herz anderen Göttern zu.", "Seine Geschichte zeigt: Ein guter Anfang garantiert kein gutes Ende."], "eval": "nuance"}, {"title": "Rehabeam", "a": "👑", "o": "💔", "b": "👥", "frames": ["Nach Salomo wurde Rehabeam König.", "Er weigerte sich, die Last des Volkes zu erleichtern.", "Das Reich teilte sich.", "Rehabeam regierte Juda im Süden."], "eval": "schlecht"}, {"title": "Jerobeam", "a": "👑", "o": "🐂", "b": "⬆️", "frames": ["Jerobeam wurde erster König des Nordreichs.", "Er richtete Kultstätten mit goldenen Kälbern ein.", "Er führte Israel in einen Kult, den der biblische Bericht verurteilt."], "eval": "schlecht"}, {"title": "Hiskia", "a": "👑", "o": "🙏", "b": "📜", "frames": ["Hiskia war König von Juda.", "Er vertraute dem Herrn und führte Reformen durch.", "Als er krank wurde, betete er.", "Der Prophet Jesaja überbrachte ihm eine Botschaft Gottes."], "eval": "gut"}, {"title": "Josia", "a": "👑", "o": "📖", "b": "✨", "frames": ["Josia wurde sehr jung König von Juda.", "Bei Arbeiten am Tempel wurde das Buch des Gesetzes gefunden.", "Josia demütigte sich und führte eine große Reform durch.", "Der Bericht beschreibt ihn als einen König, der am Bund festhielt."], "eval": "gut"}];
function start(){storyPlayer(K,kingdoms)}function kingdoms(){G.innerHTML=`<main><h1>🗺️ ${lang==="fr"?"Royaume uni puis division":"Vereinigtes Reich und Teilung"}</h1><div class=card><h2>👑 ${lang==="fr"?"Saül → David → Salomon":"Saul → David → Salomo"}</h2></div><div class=map><div class="kingdom north"><h2>⬆️ Israel</h2><p>${lang==="fr"?"Royaume du Nord. Premier roi après la division : Jéroboam.":"Nordreich. Erster König nach der Teilung: Jerobeam."}</p></div><div class="kingdom south"><h2>⬇️ Juda</h2><p>${lang==="fr"?"Royaume du Sud. Roboam y règne après la division.":"Südreich. Rehabeam regiert dort nach der Teilung."}</p></div></div><button id=n class=next>→</button></main>`;n.onclick=goodBad}function goodBad(){let list=sh(K.filter(x=>x.eval!=="nuance")),q=0;function ask(){if(q===list.length)return israelJuda();let x=list[q],good=(x.eval==="bon"||x.eval==="gut");G.innerHTML=`<main><h2>👑 ${x.title}</h2><p>${lang==="fr"?"Après avoir entendu son histoire, comment le récit biblique évalue-t-il principalement ce roi ?":"Wie bewertet der biblische Bericht diesen König nach seiner Geschichte hauptsächlich?"}</p><div class=grid><button id=g class="choice goodking">${lang==="fr"?"BON ROI":"GUTER KÖNIG"}</button><button id=b class="choice badking">${lang==="fr"?"MAUVAIS ROI":"SCHLECHTER KÖNIG"}</button></div></main>`;g.onclick=()=>pick(true);b.onclick=()=>pick(false);function pick(v){if(v!==good)return; q++;ask()}}ask()}function israelJuda(){let Q=lang==="fr"?[["Jéroboam","Israel"],["Roboam","Juda"],["Ézéchias","Juda"],["Josias","Juda"]]:[["Jerobeam","Israel"],["Rehabeam","Juda"],["Hiskia","Juda"],["Josia","Juda"]],q=0;function ask(){if(q===Q.length)return contemporaries();let z=Q[q];G.innerHTML=`<main><h2>🗺️ ${z[0]}</h2><p>${lang==="fr"?"Dans quel royaume ce roi règne-t-il ?":"In welchem Reich regiert dieser König?"}</p><div class=grid><button id=i class=choice>⬆️ Israel</button><button id=j class=choice>⬇️ Juda</button></div></main>`;i.onclick=()=>pick("Israel");j.onclick=()=>pick("Juda");function pick(x){if(x!==z[1])return;q++;ask()}}ask()}function contemporaries(){let Q=lang==="fr"?[["Ézéchias","Osée"],["Asa","Baescha"]]:[["Hiskia","Hoschea"],["Asa","Bascha"]],q=0;function ask(){if(q===Q.length)return reward(lang==="fr"?"Rois et royaumes maîtrisés !":"Könige und Reiche gemeistert!","👑");let z=Q[q],wrong=lang==="fr"?["Achab","Jéroboam","Omri"]:["Ahab","Jerobeam","Omri"],opts=sh([z[1],...wrong.filter(x=>x!==z[1]).slice(0,3)]);G.innerHTML=`<main><h2>⭐ PROFI</h2><div class=timeline><div class=lane><b>Juda</b><h2>${z[0]}</h2></div><div class=lane><b>Israel</b><h2>?</h2></div></div><p>${lang==="fr"?"Quel roi d’Israël est présenté comme contemporain de ce roi de Juda dans ce niveau ?":"Welcher König Israels wird in diesem Level als Zeitgenosse dieses Königs von Juda gelernt?"}</p><div class=grid>${opts.map((x,i)=>`<button data-i="${i}" class=choice>${x}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-i]").forEach((b,i)=>b.onclick=()=>{if(opts[i]!==z[1])return;q++;ask()})}ask()}start();</script></body></html>
