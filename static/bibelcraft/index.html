<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>BibelCraft</title><style>
*{box-sizing:border-box}body{margin:0;background:#c9e9fa;font:600 15px system-ui;color:#17334c}header{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fffdf0;flex-wrap:wrap}header a{color:#17334c}header strong{font-size:20px}button,select{font:inherit;border:0;border-radius:12px;padding:11px;background:#fff;cursor:pointer}button:focus-visible{outline:3px solid #246fbd}.active{background:#ffd05e}main{max-width:1200px;margin:auto;padding:8px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:12px}canvas{display:block;width:100%;height:min(68vh,650px);background:linear-gradient(#9edfff,#d5f4c7);border-radius:18px;touch-action:none}aside{background:#fffdf2;padding:12px;border-radius:16px}aside h2{font-size:17px;margin:4px 0 10px}.palette{display:grid;grid-template-columns:1fr 1fr;gap:6px}.palette button{padding:12px 5px;background:#e7f1e2}.palette button.active{background:#ffd05e}.bar{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.status{font-size:13px;margin-top:10px}#message{min-height:38px} @media(max-width:700px){.layout{grid-template-columns:1fr}canvas{height:52vh}aside{order:2}.palette{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><a href="/">← BibelQuiz</a><strong>🧱 BibelCraft</strong><select id="lang"><option value="fr">Français</option><option value="de">Deutsch</option></select><button id="save">💾 Sauver</button><button id="reset">↻ Nouveau monde</button></header><main><div class="layout"><canvas id="world" aria-label="Monde de construction"></canvas><aside><h2 id="subtitle">Construis ton monde</h2><div class="palette" id="palette"></div><div class="bar"><button id="erase">🧽 Effacer</button><button id="rotate">🔄 Tourner</button></div><h2 id="missionTitle">🎯 Mission</h2><p id="mission"></p><p id="message" aria-live="polite"></p><div class="status" id="status"></div><p id="hint">Touchez une case pour construire. Glissez pour déplacer la vue. Molette pour zoomer.</p></aside></div></main><script src="game.js"></script></body></html>
