<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta http-equiv="Cache-Control" content="no-store"><title>BibelQuiz V11.0.6 armor</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#123e69;background:linear-gradient(#ccefff,#fff2bf);min-height:100vh}main{max-width:900px;margin:auto;padding:14px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}button{border:0;border-radius:15px;padding:13px;font-weight:900;color:#123e69}.progress{height:18px;background:#dce9ef;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#48c965}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{background:#fff;min-height:72px;font-size:16px;box-shadow:0 4px 12px #0002}.scene{position:relative;min-height:52vh;border-radius:28px;overflow:hidden}.toast{position:fixed;left:50%;bottom:7%;transform:translateX(-50%);background:#173d5d;color:#fff;padding:13px 18px;border-radius:18px;z-index:99;font-weight:900}.reward{text-align:center;background:#fff8;border-radius:28px;padding:24px}.big{font-size:95px}.stars{font-size:42px}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}.themed{background:linear-gradient(#80d8ff 0 60%,#7ac45d 60%);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px}.themed>div{width:100%;text-align:center;font-size:100px}.themed span{background:#fff9;border-radius:12px;padding:8px;font-weight:900}.phase{display:inline-block;background:#fff;padding:8px 12px;border-radius:14px;font-weight:900}.hearts{text-align:center;font-size:28px}.themed{background:linear-gradient(#7ed8ff,#7bc65d);display:flex;align-items:center;justify-content:center}.sceneIcon{font-size:145px}.badge{font-size:90px}.next-btn{display:block;width:min(92%,520px);margin:18px auto;padding:18px 20px!important;background:#48c965!important;color:#fff!important;font-size:18px!important}.correct-reveal{background:#dff8e5;border:3px solid #48c965;border-radius:17px;padding:14px;margin:12px;text-align:center}.learning-help{background:#fff8;border-radius:15px;padding:10px}.master-top{display:flex;justify-content:space-between}.scorebox,.instruction,.preview{background:#fff;padding:10px;border-radius:12px}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memory-card{min-height:100px;background:#164d7b;color:#fff}.memory-card.open,.memory-card.done{background:#fff;color:#123e69}.token-bank,.preview-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.token{background:#fff;padding:11px}.token.selected{outline:5px solid #ffd343}.dropzone{border:5px dashed #fff;background:#fff6;border-radius:24px;padding:12px;text-align:center}.tree{font-size:170px}.soldier{text-align:center;font-size:160px}.countdown{text-align:center;font-size:60px}.boat-scene,.camp-scene{min-height:240px;border-radius:24px;display:grid;place-items:center;font-size:80px}.boat-scene{background:#68ccef}.camp-scene{background:#dfc47c}.master-end{text-align:center;background:#fff;padding:24px;border-radius:24px}.medal{font-size:90px}.next-btn{display:block;width:90%;margin:15px auto;background:#48c965!important;color:#fff!important}@media(max-width:600px){.memory-grid{grid-template-columns:repeat(3,1fr)}}
.draggable{touch-action:none;cursor:grab}.dragging{opacity:.55;transform:scale(1.08)}
.drop-active{outline:6px solid #ffd54f}
.balloon-stage{position:relative;height:62vh;overflow:hidden;border-radius:25px;background:linear-gradient(#86dcff,#e7f8ff)}
.balloon{position:absolute;width:115px;min-height:135px;border-radius:55% 55% 48% 48%;background:#fff;border:4px solid #69a8d5;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-weight:900;box-shadow:0 6px 14px #0002;animation:floatDown 8s linear forwards}
.balloon:after{content:"";position:absolute;bottom:-22px;width:2px;height:22px;background:#555}
@keyframes floatDown{from{top:-150px}to{top:105%}}
.equip-person{position:relative;width:230px;height:350px;margin:auto}.equip-person .body{font-size:210px;position:absolute;inset:45px 0 0;text-align:center}.worn{position:absolute;z-index:3;font-size:52px}.worn.head{top:18px;left:89px}.worn.left{top:145px;left:25px}.worn.right{top:145px;right:22px}.worn.waist{top:190px;left:92px}.worn.chest{top:112px;left:90px}.worn.feet{bottom:5px;left:83px}
.memory-scene{font-size:34px;min-height:100px;display:grid;place-items:center}
</style></head><body><div id="game"><main><div class="card"><h2>🔵 HTML V11.0.6 chargé</h2><p>armor</p></div></main></div><script>
(function(){
  var root=document.getElementById("game");
  function show(msg,detail){
    if(!root)return;
    root.innerHTML='<main><div class="card"><h2>'+msg+'</h2>'+(detail?'<pre style="white-space:pre-wrap;text-align:left">'+String(detail).replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</pre>':'')+'<button data-home="1">← BibelQuiz</button></div></main>';
  }
  show("✅ BOOT HTML V11.0.6","armor");
  window.addEventListener("error",function(e){show("⚠️ ERREUR JAVASCRIPT", (e.message||"Erreur")+" @ "+(e.filename||"inline")+":"+(e.lineno||0)+":"+(e.colno||0));});
  setTimeout(function(){
    try{
      const lang=localStorage.getItem("bibelquiz_language")==="fr"?"fr":"de",G=document.getElementById("game"),sh=a=>[...a].sort(()=>Math.random()-.5);let score=0,maxScore=0;function say(x){if(!("speechSynthesis"in window))return;let u=new SpeechSynthesisUtterance(String(x));u.lang=lang==="fr"?"fr-FR":"de-DE";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}function toast(x){let d=document.createElement("div");d.className="toast";d.textContent=x;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}function top(t,p){return `<header><button data-home="1">← BibelQuiz</button><h2>${t}</h2></header><div class=master-top><b>${p}</b><span class=scorebox>⭐ ${score}/${maxScore}</span></div>`}function good(){score++;maxScore++;toast("✨ +1 ⭐")}function bad(){maxScore++;toast(lang==="fr"?"Essaie encore 😊":"Versuch es noch einmal 😊")}function finish(t,i){let p=maxScore?score/maxScore:1,m=p>=.85?"🥇":p>=.65?"🥈":"🥉";G.innerHTML=`<main><div class=master-end><div class=medal>${m}</div><h1>${i} ${t}</h1><p>⭐ ${score}/${maxScore}</p><button data-reload="1">🔄</button> <button data-home="1">← BibelQuiz</button></div></main>`}const A=lang==="fr"?[["🪖", "Casque", "Salut"], ["🛡️", "Bouclier", "Foi"], ["⚔️", "Épée", "Esprit"], ["👞", "Chaussures", "Évangile de paix"], ["🧷", "Ceinture", "Vérité"], ["🥋", "Cuirasse", "Justice"]]:[["🪖", "Helm", "Heil"], ["🛡️", "Schild", "Glaube"], ["⚔️", "Schwert", "Geist"], ["👞", "Schuhe", "Evangelium des Friedens"], ["🧷", "Gürtel", "Wahrheit"], ["🥋", "Brustpanzer", "Gerechtigkeit"]],C=["#e55","#49f","#5b6","#fa3","#a5c","#2a9"];let n=0,op=[],matched=new Set(),lock=false,sel=null,equipped=[];
function learn(){if(n===6)return memory();let a=A[n];G.innerHTML=`<main>${top(lang==="fr"?"🛡️ Armure de Dieu":"🛡️ Waffenrüstung Gottes","1. "+(lang==="fr"?"DÉCOUVRIR":"ENTDECKEN"))}<div class=soldier>🧍</div><div class=card style="border:5px solid ${C[n]}"><h1>${a[0]} ${a[1]} ↔ ${a[2]}</h1><button data-act="speakCurrent">🔊</button><button class=next-btn data-act="nextLearn">→</button></div></main>`;say(a[1]+" "+a[2])}function memory(){op=[];matched=new Set();window.cards=sh(A.flatMap((a,i)=>[{i,text:a[0]+" "+a[1],s:0},{i,text:a[2],s:1}]));drawM()}
function drawM(){if(matched.size===6)return equip();G.innerHTML=`<main>${top("🛡️ Memory","2. MEMORY")}<div class=instruction>${lang==="fr"?"Retourne 2 cartes. Associe objet et signification.":"Drehe 2 Karten um. Verbinde Gegenstand und Bedeutung."}</div><div class=memory-grid>${cards.map((c,k)=>`<button class="memory-card ${matched.has(c.i)?"done":op.includes(k)?"open":""}" style="--pair:${C[c.i]}" data-act="flip" data-k="${k}">${matched.has(c.i)||op.includes(k)?c.text:"❓"}</button>`).join("")}</div></main>`}
function flip(k){if(lock||op.includes(k)||matched.has(cards[k].i))return;op.push(k);drawM();if(op.length===2){lock=true;let a=cards[op[0]],b=cards[op[1]];setTimeout(()=>{if(a.i===b.i&&a.s!==b.s){matched.add(a.i);good()}else bad();op=[];lock=false;drawM()},650)}}
function equip(){sel=null;equipped=[];drawE()}
function drawE(){if(equipped.length===6)return finish(lang==="fr"?"Armure de Dieu":"Waffenrüstung Gottes","🛡️");let r=A.map((_,i)=>i).filter(i=>!equipped.includes(i));G.innerHTML=`<main>${top("🛡️","3. "+(lang==="fr"?"ÉQUIPE LE SOLDAT":"RÜSTE DEN SOLDATEN AUS"))}<div class=instruction>${lang==="fr"?"Glisse une pièce sur le soldat, ou touche la pièce puis le soldat.":"Ziehe ein Teil auf den Soldaten, oder tippe erst das Teil und dann den Soldaten."}</div><div class=equip-person data-act="place" data-drop="soldier"><div class=body>🧍</div>${equipped.map(i=>`<span class="worn ${["head","left","right","feet","waist","chest"][i]}">${A[i][0]}</span>`).join("")}</div><div class=token-bank>${r.map(i=>`<button class="token ${sel===i?"selected":""}" data-act="select" data-i="${i}" data-drag="${i}">${A[i][0]} ${A[i][1]}</button>`).join("")}</div></main>`;enableDrag()}
function place(){if(sel===null)return;equipped.push(sel);good();sel=null;drawE()}
window.say=say;window.learn=learn;window.flip=flip;window.drawE=drawE;window.place=place;
document.addEventListener("click",function(e){let b=e.target.closest("button");if(!b)return;if(b.dataset.home){location.href="/";return}if(b.dataset.reload){location.reload();return}let a=b.dataset.act;if(a==="speakCurrent")say(A[n][1]+" "+A[n][2]);else if(a==="nextLearn"){n++;learn()}else if(a==="flip")flip(Number(b.dataset.k));else if(a==="select"){sel=Number(b.dataset.i);drawE()}else if(a==="place")place()});

let dragEl=null,dragData=null;
function enableDrag(){
 document.querySelectorAll("[data-drag]").forEach(el=>{
  el.classList.add("draggable");
  el.onpointerdown=e=>{dragEl=el;dragData=el.dataset.drag;el.setPointerCapture?.(e.pointerId);el.classList.add("dragging")};
  el.onpointerup=e=>{if(!dragEl)return;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-drop]");dragEl.classList.remove("dragging");if(target)handleDrop(dragData,target.dataset.drop);dragEl=null;dragData=null};
 });
}
function handleDrop(data,target){if(target!=="soldier")return;sel=Number(data);place()}learn();
    }catch(e){
      show("⚠️ ERREUR AU DÉMARRAGE", (e&&e.name?e.name+": ":"")+(e&&e.message?e.message:String(e))+(e&&e.stack?"\n"+e.stack:""));
    }
  },0);
})();
</script></body></html>
