<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#123e69;background:linear-gradient(#ccefff,#fff1bf);min-height:100vh}main{max-width:900px;margin:auto;padding:14px}button{border:0;border-radius:15px;padding:13px;font-weight:850;color:#123e69}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice,.card{background:#fff;min-height:90px}.card{border-radius:20px;padding:16px;margin:10px 0}.story-stage{height:280px;border-radius:24px;background:linear-gradient(#8bdcff 0 62%,#8fca6e 62%);position:relative;overflow:hidden}.actor{position:absolute;bottom:30px;font-size:75px}.a{left:16%}.b{right:16%}.object{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:78px}.caption{background:#fff;border-radius:18px;padding:15px;font-size:19px;font-weight:800;margin:10px 0}.next{display:block;width:90%;margin:12px auto;background:#49c969;color:white}.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kingdom{border-radius:22px;padding:14px}.north{background:#bce5ff}.south{background:#ffd8a8}.timeline{display:grid;grid-template-columns:1fr 1fr;gap:10px}.timeline .lane{background:#fff8;padding:12px;border-radius:18px}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memory-card{min-height:90px;background:#164d7b;color:#fff}.memory-card.open,.memory-card.done{background:#fff;color:#123e69}.reward{text-align:center;background:#fff;border-radius:25px;padding:25px}.goodking{border:4px solid #52b76b}.badking{border:4px solid #dc6666}.bq-music{position:fixed;right:10px;bottom:10px;z-index:9999}.bq-music button{background:#fff}@media(max-width:600px){.map,.timeline{grid-template-columns:1fr}.memory-grid{grid-template-columns:repeat(3,1fr)}}</style><script src="/static/bq-audio.js"></script></head><body><div id=game></div><script>const lang=localStorage.getItem("bibelquiz_language")==="fr"?"fr":"de",G=document.getElementById("game"),sh=a=>[...a].sort(()=>Math.random()-.5);function say(x){if(window.BQAudio)return BQAudio.speak(x)}function reward(t,i){G.innerHTML=`<main><div class=reward><div style="font-size:90px">${i}</div><h1>${t}</h1><button onclick="location.href='/'">← BibelQuiz</button></div></main>`}function storyPlayer(stories,next){let s=0,f=0;function show(){if(s===stories.length)return next();let z=stories[s],frames=z.frames;G.innerHTML=`<main><h2>🎬 ${z.title}</h2><div class=story-stage><div class="actor a">${z.a}</div><div class=object>${z.o}</div><div class="actor b">${z.b}</div></div><div class=caption>${frames[f]}</div><button id=listen>🔊</button><button id=n class=next>→</button></main>`;say(frames[f]);listen.onclick=()=>say(frames[f]);n.onclick=()=>{if(f<frames.length-1){f++;show()}else{s++;f=0;show()}}}show()}const J=lang==="fr"?[{"title": "Débora", "a": "👩", "o": "🌴", "b": "⚔️", "frames": ["Débora était prophétesse et juge en Israël.", "Elle transmet à Barak l’ordre de partir au combat.", "Barak lui demande de venir avec lui.", "Après la victoire, Débora et Barak chantent un cantique."], "key": "Prophétesse et juge"}, {"title": "Gédéon", "a": "👨", "o": "🏺🔥", "b": "🎺", "frames": ["Gédéon est appelé alors qu’Israël souffre sous Madian.", "Dieu réduit son armée jusqu’à trois cents hommes.", "Ils utilisent trompettes, jarres et torches.", "La victoire montre que la force ne venait pas du nombre de soldats."], "key": "300 hommes"}, {"title": "Jephté", "a": "👨", "o": "⚔️", "b": "👥", "frames": ["Jephté est appelé pour conduire Israël contre les Ammonites.", "Il devient chef malgré un passé difficile.", "Son histoire contient aussi un vœu très grave et tragique.", "Elle rappelle qu’il faut être prudent avec ses paroles et ses vœux."], "key": "Vœu imprudent"}, {"title": "Samson", "a": "💪", "o": "🦁", "b": "✂️", "frames": ["Samson est consacré dès avant sa naissance.", "Dieu lui donne une force extraordinaire.", "Il combat les Philistins mais fait aussi de mauvais choix.", "À la fin, il prie Dieu une dernière fois."], "key": "Force extraordinaire"}]:[{"title": "Debora", "a": "👩", "o": "🌴", "b": "⚔️", "frames": ["Debora war Prophetin und Richterin in Israel.", "Sie übermittelt Barak den Auftrag, in den Kampf zu ziehen.", "Barak bittet sie, mitzukommen.", "Nach dem Sieg singen Debora und Barak ein Lied."], "key": "Prophetin und Richterin"}, {"title": "Gideon", "a": "👨", "o": "🏺🔥", "b": "🎺", "frames": ["Gideon wird berufen, als Israel unter Midian leidet.", "Gott verkleinert sein Heer bis auf dreihundert Männer.", "Sie benutzen Trompeten, Krüge und Fackeln.", "Der Sieg zeigt, dass die Stärke nicht von der Zahl der Soldaten kam."], "key": "300 Männer"}, {"title": "Jefta", "a": "👨", "o": "⚔️", "b": "👥", "frames": ["Jefta wird gerufen, Israel gegen die Ammoniter zu führen.", "Trotz einer schwierigen Vergangenheit wird er Anführer.", "Seine Geschichte enthält auch ein sehr schweres und tragisches Gelübde.", "Sie erinnert daran, mit Worten und Gelübden vorsichtig zu sein."], "key": "Unbedachtes Gelübde"}, {"title": "Simson", "a": "💪", "o": "🦁", "b": "✂️", "frames": ["Simson wird schon vor seiner Geburt Gott geweiht.", "Gott gibt ihm außergewöhnliche Kraft.", "Er kämpft gegen die Philister, trifft aber auch schlechte Entscheidungen.", "Am Ende betet er noch einmal zu Gott."], "key": "Außergewöhnliche Kraft"}];function start(){storyPlayer(J,quiz)}function quiz(){let q=0;function ask(){if(q===5)return memory();let z=J[Math.floor(Math.random()*J.length)],opts=sh([z.title,...sh(J.filter(x=>x!==z)).slice(0,3).map(x=>x.title)]);G.innerHTML=`<main><h2>⚖️ QUIZ ${q+1}/5</h2><p>${z.frames[Math.floor(Math.random()*z.frames.length)]}</p><div class=grid>${opts.map((x,i)=>`<button data-i="${i}" class=choice>${x}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-i]").forEach((b,i)=>b.onclick=()=>{if(opts[i]!==z.title)return;q++;ask()})}ask()}function memory(){let pairs=sh(J.flatMap((x,j)=>[{j,t:x.title},{j,t:x.key}])),op=[],done=new Set(),lock=false;function draw(){if(done.size===J.length)return reward(lang==="fr"?"Juges maîtrisés !":"Richter gemeistert!","⚖️");G.innerHTML=`<main><h2>🧠 ${lang==="fr"?"Juge ↔ événement":"Richter ↔ Ereignis"}</h2><div class=memory-grid>${pairs.map((c,k)=>`<button data-k="${k}" class="memory-card ${done.has(c.j)?"done":op.includes(k)?"open":""}">${done.has(c.j)||op.includes(k)?c.t:"❓"}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>flip(+b.dataset.k))}function flip(k){if(lock||op.includes(k)||done.has(pairs[k].j))return;op.push(k);draw();if(op.length===2){lock=true;setTimeout(()=>{if(pairs[op[0]].j===pairs[op[1]].j)done.add(pairs[op[0]].j);op=[];lock=false;draw()},650)}}draw()}start();</script></body></html>
