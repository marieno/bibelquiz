<meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#123e69;background:linear-gradient(#ccefff,#fff2bf);min-height:100vh}main{max-width:900px;margin:auto;padding:14px}button{border:0;border-radius:15px;padding:13px;font-weight:850;color:#123e69}.card{background:#fff;border-radius:20px;padding:16px;margin:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{background:#fff;min-height:90px}.scene{font-size:90px;text-align:center;background:#fff8;border-radius:25px;padding:24px}.next{display:block;width:90%;margin:14px auto;background:#49ca68;color:white}.reward{text-align:center;background:#fff;border-radius:25px;padding:25px}.balloon-stage{height:58vh;position:relative;overflow:hidden;background:#9de3ff;border-radius:24px}.balloon{position:absolute;top:-130px;width:115px;min-height:125px;border-radius:55%;background:#fff;border:4px solid #69a8d5;animation:fall 8s linear forwards}@keyframes fall{to{top:105%}}.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kingdom{padding:15px;border-radius:22px;min-height:220px}.north{background:#bde5ff}.south{background:#ffd8a8}@media(max-width:600px){.map{grid-template-columns:1fr}}</style><div id=game></div><script>const lang=localStorage.getItem("bibelquiz_language")==="fr"?"fr":"de",G=document.getElementById("game"),sh=a=>[...a].sort(()=>Math.random()-.5);let lives=3,reserve=Number(localStorage.getItem("bq_reserve_hearts")||0);function hud(){return "❤️".repeat(lives)+" 🟡"+reserve}function say(x){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(x));u.lang=lang==="fr"?"fr-FR":"de-DE";speechSynthesis.speak(u)}function lose(retry){if(reserve>0){reserve--;localStorage.setItem("bq_reserve_hearts",reserve);return true}lives--;if(lives>0)return true;G.innerHTML=`<main><div class=reward><h1>💔 ${lang==="fr"?"Plus de vies":"Keine Leben mehr"}</h1><button id=a>${lang==="fr"?"REJOUER":"NOCH EINMAL"}</button></div></main>`;a.onclick=()=>{lives=3;retry()};return false}function reward(t,i){G.innerHTML=`<main><div class=reward><div style="font-size:90px">${i}</div><h1>${t}</h1><button onclick="location.href='/'">← BibelQuiz</button></div></main>`}const N=lang==="fr"?[[1, "Un seul Dieu", "☝️"], [2, "Deux Testaments : Ancien et Nouveau", "📖"], [3, "Père, Fils et Saint-Esprit", "✝️🕊️"], [4, "Quatre Évangiles", "📚"], [5, "Cinq livres de Moïse", "📜"], [6, "Six jarres de pierre à Cana", "🏺"], [7, "Sept chandeliers d’or dans l’Apocalypse", "🕯️"], [8, "Huit personnes sauvées dans l’arche", "🛶"], [9, "Neuf qualités du fruit de l’Esprit", "🍎"], [10, "Dix Commandements", "🔟"], [12, "Douze tribus d’Israël et douze apôtres", "👥"], [30, "Trente pièces d’argent", "🪙"], [40, "Quarante jours et nuits de pluie au déluge", "🌧️"], [153, "Cent cinquante-trois poissons", "🐟"]]:[[1, "Ein Gott", "☝️"], [2, "Zwei Testamente: Altes und Neues", "📖"], [3, "Vater, Sohn und Heiliger Geist", "✝️🕊️"], [4, "Vier Evangelien", "📚"], [5, "Fünf Bücher Mose", "📜"], [6, "Sechs steinerne Wasserkrüge in Kana", "🏺"], [7, "Sieben goldene Leuchter in der Offenbarung", "🕯️"], [8, "Acht Menschen wurden in der Arche gerettet", "🛶"], [9, "Neun Eigenschaften der Frucht des Geistes", "🍎"], [10, "Zehn Gebote", "🔟"], [12, "Zwölf Stämme Israels und zwölf Apostel", "👥"], [30, "Dreißig Silberstücke", "🪙"], [40, "Vierzig Tage und Nächte Regen bei der Sintflut", "🌧️"], [153, "Hundertdreiundfünfzig Fische", "🐟"]];let i=0;function learn(){if(i===N.length)return quiz();let x=N[i];G.innerHTML=`<main><h1>🔢 ${lang==="fr"?"Nombres dans la Bible":"Zahlen in der Bibel"} · ${hud()}</h1><div class=scene>${x[2]}<br>${x[0]}</div><div class=card><h2>${x[1]}</h2><button id=s>🔊</button><button id=n class=next>→</button></div></main>`;say(x[0]+". "+x[1]);s.onclick=()=>say(x[1]);n.onclick=()=>{i++;learn()}}function quiz(){let q=0;function ask(){if(q===10)return balloons();let t=N[Math.floor(Math.random()*N.length)],o=sh([t,...sh(N.filter(x=>x[0]!==t[0])).slice(0,3)]);G.innerHTML=`<main><h2>❓ ${q+1}/10 · ${hud()}</h2><div class=scene>${t[2]}</div><h2>${t[1]}</h2><div class=grid>${o.map((x,k)=>`<button data-k="${k}" class=choice>${x[0]}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-k]").forEach((b,k)=>b.onclick=()=>{if(o[k][0]!==t[0]){lose(quiz);return}q++;ask()})}ask()}function balloons(){let good=N.slice(0,10),bad=[11,13,14,15,20],items=sh([...good.map(x=>({x:x[0],ok:1})),...bad.map(x=>({x,ok:0}))]),hit=new Set();G.innerHTML=`<main><h2>🎈 ${lang==="fr"?"Éclate les nombres appris 1–10":"Zerplatze die gelernten Zahlen 1–10"}</h2><div id=bs class=balloon-stage></div></main>`;let st=bs;items.forEach((o,k)=>{let b=document.createElement("button");b.className="balloon";b.textContent=o.x;b.style.left=(4+(k*17)%78)+"%";b.onclick=()=>{if(o.ok){hit.add(o.x);b.remove();if(hit.size===10)reward(lang==="fr"?"Nombres maîtrisés !":"Bibelzahlen gemeistert!","🔢")}else lose(balloons)};b.onanimationend=()=>{if(b.isConnected){b.style.animation="none";void b.offsetHeight;b.style.left=Math.random()*78+"%";b.style.animation="fall 8s linear forwards"}};st.appendChild(b)})}learn();</script>
