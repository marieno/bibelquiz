<script src="/static/bq-audio.js"></script><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#123e69;background:linear-gradient(#ccefff,#fff2bf);min-height:100vh}main{max-width:900px;margin:auto;padding:14px}button{border:0;border-radius:15px;padding:13px;font-weight:850;color:#123e69}.card{background:#fff;border-radius:20px;padding:16px;margin:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{background:#fff;min-height:90px}.scene{font-size:90px;text-align:center;background:#fff8;border-radius:25px;padding:24px}.next{display:block;width:90%;margin:14px auto;background:#49ca68;color:white}.reward{text-align:center;background:#fff;border-radius:25px;padding:25px}.balloon-stage{height:58vh;position:relative;overflow:hidden;background:#9de3ff;border-radius:24px}.balloon{position:absolute;top:-130px;width:115px;min-height:125px;border-radius:55%;background:#fff;border:4px solid #69a8d5;animation:fall 8s linear forwards}@keyframes fall{to{top:105%}}.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kingdom{padding:15px;border-radius:22px;min-height:220px}.north{background:#bde5ff}.south{background:#ffd8a8}@media(max-width:600px){.map{grid-template-columns:1fr}}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memory-card{min-height:95px;background:#174e78;color:#fff}.memory-card.open,.memory-card.done{background:#fff;color:#123e69}.balloon{background:var(--balloon,#fff)!important;border:4px solid #fff!important;box-shadow:0 7px 15px #0003}.balloon-stage{padding:0 10px}@media(max-width:600px){.memory-grid{grid-template-columns:repeat(3,1fr)}} </style><div id=game></div><script>const lang=localStorage.getItem("bibelquiz_language")==="fr"?"fr":"de",G=document.getElementById("game"),sh=a=>[...a].sort(()=>Math.random()-.5);let lives=3,reserve=Number(localStorage.getItem("bq_reserve_hearts")||0);function hud(){return "❤️".repeat(lives)+" 🟡"+reserve}function say(x){if(window.BQAudio)return BQAudio.speak(x);if(!("speechSynthesis"in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(x));u.lang=lang==="fr"?"fr-FR":"de-DE";speechSynthesis.speak(u)}function lose(retry){if(reserve>0){reserve--;localStorage.setItem("bq_reserve_hearts",reserve);return true}lives--;if(lives>0)return true;G.innerHTML=`<main><div class=reward><h1>💔 ${lang==="fr"?"Plus de vies":"Keine Leben mehr"}</h1><button id=a>${lang==="fr"?"REJOUER":"NOCH EINMAL"}</button><button id=lifeBonus>❤️ ${lang==="fr"?"GAGNER DES VIES":"LEBEN GEWINNEN"}</button></div></main>`;a.onclick=()=>{lives=3;retry()};lifeBonus.onclick=()=>bonusLives(retry);return false}function bonusLives(retry){let q=0,won=0,Q=lang==="fr"?[["Combien d’apôtres ?",12,[7,10,12,40]],["Combien d’Évangiles ?",4,[2,4,5,12]],["Combien de Commandements ?",10,[7,9,10,12]]]:[["Wie viele Apostel?",12,[7,10,12,40]],["Wie viele Evangelien?",4,[2,4,5,12]],["Wie viele Gebote?",10,[7,9,10,12]]];function ask(){if(q===3){lives=Math.max(1,won);G.innerHTML=`<main><div class=reward><h1>❤️ ${won}/3</h1><button id=go>${lang==="fr"?"CONTINUER":"WEITER"}</button></div></main>`;go.onclick=retry;return}let z=Q[q],opts=sh(z[2]);G.innerHTML=`<main><h2>❤️ BONUS ${q+1}/3</h2><p>${z[0]}</p><div class=grid>${opts.map((x,i)=>`<button class=choice data-bi="${i}">${x}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-bi]").forEach((b,i)=>b.onclick=()=>{if(opts[i]===z[1])won++;q++;ask()})}ask()}function reward(t,i){G.innerHTML=`<main><div class=reward><div style="font-size:90px">${i}</div><h1>${t}</h1><button onclick="location.href='/'">← BibelQuiz</button></div></main>`}const N=lang==="fr"?[[1, "Un seul Dieu", "☝️"], [2, "Deux Testaments : Ancien et Nouveau", "📖"], [3, "Père, Fils et Saint-Esprit", "✝️🕊️"], [4, "Quatre Évangiles", "📚"], [5, "Cinq livres de Moïse", "📜"], [6, "Six jarres de pierre à Cana", "🏺"], [7, "Sept chandeliers d’or dans l’Apocalypse", "🕯️"], [8, "Huit personnes sauvées dans l’arche", "🛶"], [9, "Neuf qualités du fruit de l’Esprit", "🍎"], [10, "Dix Commandements", "🔟"], [12, "Douze tribus d’Israël et douze apôtres", "👥"], [30, "Trente pièces d’argent", "🪙"], [40, "Quarante jours et nuits de pluie au déluge", "🌧️"], [153, "Cent cinquante-trois poissons", "🐟"]]:[[1, "Ein Gott", "☝️"], [2, "Zwei Testamente: Altes und Neues", "📖"], [3, "Vater, Sohn und Heiliger Geist", "✝️🕊️"], [4, "Vier Evangelien", "📚"], [5, "Fünf Bücher Mose", "📜"], [6, "Sechs steinerne Wasserkrüge in Kana", "🏺"], [7, "Sieben goldene Leuchter in der Offenbarung", "🕯️"], [8, "Acht Menschen wurden in der Arche gerettet", "🛶"], [9, "Neun Eigenschaften der Frucht des Geistes", "🍎"], [10, "Zehn Gebote", "🔟"], [12, "Zwölf Stämme Israels und zwölf Apostel", "👥"], [30, "Dreißig Silberstücke", "🪙"], [40, "Vierzig Tage und Nächte Regen bei der Sintflut", "🌧️"], [153, "Hundertdreiundfünfzig Fische", "🐟"]];const CLUE=lang==="fr"?["Combien de Dieu adorons-nous ?", "Combien de parties principales compose la Bible chrétienne ?", "Combien de personnes nommons-nous : Père, Fils et Saint-Esprit ?", "Combien d’Évangiles y a-t-il ?", "Combien de livres de Moïse ?", "Combien de jarres de pierre étaient à Cana ?", "Combien de chandeliers d’or sont mentionnés dans cette vision de l’Apocalypse ?", "Combien de personnes furent sauvées dans l’arche ?", "Combien de qualités composent le fruit de l’Esprit dans cette liste ?", "Combien de Commandements ?", "Combien de tribus d’Israël et d’apôtres ?", "Combien de pièces d’argent Judas reçut-il ?", "Combien de jours et nuits plut-il lors du déluge ?", "Combien de poissons furent comptés après la pêche ?"]:["Wie viele Götter beten wir an?", "Aus wie vielen Hauptteilen besteht die christliche Bibel?", "Wie viele Personen nennen wir: Vater, Sohn und Heiliger Geist?", "Wie viele Evangelien gibt es?", "Wie viele Bücher Mose gibt es?", "Wie viele steinerne Krüge standen in Kana?", "Wie viele goldene Leuchter werden in dieser Vision der Offenbarung genannt?", "Wie viele Menschen wurden in der Arche gerettet?", "Wie viele Eigenschaften umfasst die Frucht des Geistes in dieser Liste?", "Wie viele Gebote?", "Wie viele Stämme Israels und Apostel?", "Wie viele Silberstücke erhielt Judas?", "Wie viele Tage und Nächte regnete es bei der Sintflut?", "Wie viele Fische wurden nach dem Fischfang gezählt?"];let i=0;function learn(){if(i===N.length)return quiz();let x=N[i];G.innerHTML=`<main><h1>🔢 ${lang==="fr"?"Nombres dans la Bible":"Zahlen in der Bibel"} · ${hud()}</h1><div class=scene>${x[2]}<br>${x[0]}</div><div class=card><h2>${x[1]}</h2><button id=s>🔊</button><button id=n class=next>→</button></div></main>`;say(x[0]+". "+x[1]);s.onclick=()=>say(x[1]);n.onclick=()=>{i++;learn()}}function quiz(){let q=0;function ask(){if(q===10)return numberMemory();let t=N[Math.floor(Math.random()*N.length)],o=sh([t,...sh(N.filter(x=>x[0]!==t[0])).slice(0,3)]);G.innerHTML=`<main><h2>❓ ${q+1}/10 · ${hud()}</h2><div class=scene>${t[2]}</div><h2>${CLUE[N.indexOf(t)]}</h2><div class=grid>${o.map((x,k)=>`<button data-k="${k}" class=choice>${x[0]}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-k]").forEach((b,k)=>b.onclick=()=>{if(o[k][0]!==t[0]){lose(quiz);return}q++;ask()})}ask()}function numberMemory(){let src=N.slice(0,10),cards=sh(src.flatMap((x,j)=>[{j,t:String(x[0])},{j,t:x[2]+" "+CLUE[j]}])),op=[],done=new Set(),lock=false;function draw(){if(done.size===src.length)return reward(lang==="fr"?"Nombres bibliques maîtrisés !":"Bibelzahlen gemeistert!","🔢");G.innerHTML=`<main><h2>🧠 Memory · ${hud()}</h2><p>${lang==="fr"?"Associe le nombre à l’événement biblique.":"Verbinde die Zahl mit dem biblischen Ereignis."}</p><div class=memory-grid>${cards.map((c,k)=>`<button data-k="${k}" class="memory-card ${done.has(c.j)?"done":op.includes(k)?"open":""}">${done.has(c.j)||op.includes(k)?c.t:"❓"}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>flip(+b.dataset.k))}function flip(k){if(lock||op.includes(k)||done.has(cards[k].j))return;op.push(k);draw();if(op.length===2){lock=true;setTimeout(()=>{if(cards[op[0]].j===cards[op[1]].j)done.add(cards[op[0]].j);op=[];lock=false;draw()},650)}}draw()}learn();</script>
