<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;color:#123e69;background:linear-gradient(#ccefff,#fff1bf);min-height:100vh}main{max-width:900px;margin:auto;padding:14px}button{border:0;border-radius:15px;padding:13px;font-weight:850;color:#123e69}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice,.card{background:#fff;min-height:90px}.card{border-radius:20px;padding:16px;margin:10px 0}.story-stage{height:280px;border-radius:24px;background:linear-gradient(#8bdcff 0 62%,#8fca6e 62%);position:relative;overflow:hidden}.actor{position:absolute;bottom:30px;font-size:75px}.a{left:16%}.b{right:16%}.object{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:78px}.caption{background:#fff;border-radius:18px;padding:15px;font-size:19px;font-weight:800;margin:10px 0}.next{display:block;width:90%;margin:12px auto;background:#49c969;color:white}.map{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kingdom{border-radius:22px;padding:14px}.north{background:#bce5ff}.south{background:#ffd8a8}.timeline{display:grid;grid-template-columns:1fr 1fr;gap:10px}.timeline .lane{background:#fff8;padding:12px;border-radius:18px}.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.memory-card{min-height:90px;background:#164d7b;color:#fff}.memory-card.open,.memory-card.done{background:#fff;color:#123e69}.reward{text-align:center;background:#fff;border-radius:25px;padding:25px}.goodking{border:4px solid #52b76b}.badking{border:4px solid #dc6666}.bq-music{position:fixed;right:10px;bottom:10px;z-index:9999}.bq-music button{background:#fff}@media(max-width:600px){.map,.timeline{grid-template-columns:1fr}.memory-grid{grid-template-columns:repeat(3,1fr)}}.bq-global-lives{position:fixed;left:10px;bottom:10px;z-index:9998;background:#fff;padding:8px 10px;border-radius:14px;font-weight:900}.bq-reserve{color:#9a7300}</style><script src="/static/bq-audio.js"></script><script src="/static/bq-lives-v17.js"></script><script src="/static/bq-lives-hud.js"></script></head><body><div id=game></div><script>const lang=localStorage.getItem("bibelquiz_language")==="fr"?"fr":"de",G=document.getElementById("game"),sh=a=>[...a].sort(()=>Math.random()-.5);function say(x){if(window.BQAudio)return BQAudio.speak(x)}function reward(t,i){G.innerHTML=`<main><div class=reward><div style="font-size:90px">${i}</div><h1>${t}</h1><button onclick="location.href='/'">← BibelQuiz</button></div></main>`}function storyPlayer(stories,next){let s=0,f=0;function show(){if(s===stories.length)return next();let z=stories[s],frames=z.frames;G.innerHTML=`<main><h2>🎬 ${z.title}</h2><div class=story-stage><div class="actor a">${z.a}</div><div class=object>${z.o}</div><div class="actor b">${z.b}</div></div><div class=caption>${frames[f]}</div><button id=listen>🔊</button><button id=n class=next>→</button></main>`;say(frames[f]);listen.onclick=()=>say(frames[f]);n.onclick=()=>{if(f<frames.length-1){f++;show()}else{s++;f=0;show()}}}show()}const S=lang==="fr"?[{"title": "Un seul Dieu", "a": "☝️", "o": "📖", "b": "✨", "frames": ["La Bible enseigne qu’il y a un seul Dieu.", "Les chrétiens n’adorent donc pas trois dieux.", "Dans le Dieu unique, la foi chrétienne distingue le Père, le Fils et le Saint-Esprit."]}, {"title": "Le Père", "a": "👑", "o": "❤️", "b": "🙏", "frames": ["Jésus parle souvent de son Père.", "Le Père envoie le Fils.", "Dans le baptême de Jésus, une voix venant des cieux parle de Jésus comme son Fils."]}, {"title": "Le Fils", "a": "✝️", "o": "👤", "b": "📖", "frames": ["Jésus-Christ est le Fils.", "Il vient parmi les hommes.", "Les Évangiles racontent sa vie, son enseignement, sa mort et sa résurrection."]}, {"title": "Le Saint-Esprit", "a": "🕊️", "o": "🔥", "b": "👥", "frames": ["Le Saint-Esprit est présenté dans de nombreux passages bibliques.", "Au baptême de Jésus, l’Esprit descend comme une colombe.", "À la Pentecôte, les disciples sont remplis du Saint-Esprit."]}]:[{"title": "Ein Gott", "a": "☝️", "o": "📖", "b": "✨", "frames": ["Die Bibel lehrt, dass es einen Gott gibt.", "Christen beten also nicht drei Götter an.", "Im einen Gott unterscheidet der christliche Glaube Vater, Sohn und Heiligen Geist."]}, {"title": "Der Vater", "a": "👑", "o": "❤️", "b": "🙏", "frames": ["Jesus spricht oft von seinem Vater.", "Der Vater sendet den Sohn.", "Bei Jesu Taufe spricht eine Stimme aus dem Himmel über Jesus als seinen Sohn."]}, {"title": "Der Sohn", "a": "✝️", "o": "👤", "b": "📖", "frames": ["Jesus Christus ist der Sohn.", "Er kommt zu den Menschen.", "Die Evangelien erzählen von seinem Leben, seiner Lehre, seinem Tod und seiner Auferstehung."]}, {"title": "Der Heilige Geist", "a": "🕊️", "o": "🔥", "b": "👥", "frames": ["Der Heilige Geist wird in vielen Bibelstellen beschrieben.", "Bei Jesu Taufe kommt der Geist wie eine Taube herab.", "Zu Pfingsten werden die Jünger mit dem Heiligen Geist erfüllt."]}];function start(){storyPlayer(S,recognize)}function recognize(){let Q=lang==="fr"?[["Combien de personnes les chrétiens distinguent-ils dans le Dieu unique ?","Trois : le Père, le Fils et le Saint-Esprit",["Une","Deux","Trois : le Père, le Fils et le Saint-Esprit","Douze"]],["Qui est descendu comme une colombe au baptême de Jésus ?","Le Saint-Esprit",["Le Père","Le Saint-Esprit","Moïse","Pierre"]],["Qui est appelé le Fils ?","Jésus-Christ",["Jésus-Christ","David","Samuel","Élie"]]]:[["Wie viele Personen unterscheiden Christen in dem einen Gott?","Drei: Vater, Sohn und Heiliger Geist",["Eine","Zwei","Drei: Vater, Sohn und Heiliger Geist","Zwölf"]],["Wer kam bei Jesu Taufe wie eine Taube herab?","Der Heilige Geist",["Der Vater","Der Heilige Geist","Mose","Petrus"]],["Wer wird der Sohn genannt?","Jesus Christus",["Jesus Christus","David","Samuel","Elia"]]],q=0;function ask(){if(q===Q.length)return memory();let z=Q[q],opts=sh(z[2]);G.innerHTML=`<main><h2>✝️ ${q+1}/${Q.length}</h2><p>${z[0]}</p><div class=grid>${opts.map((x,i)=>`<button data-i="${i}" class=choice>${x}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-i]").forEach((b,i)=>b.onclick=()=>{if(opts[i]!==z[1])return;q++;ask()})}ask()}function memory(){let P=lang==="fr"?[["Père","👑 Père"],["Fils","✝️ Jésus-Christ"],["Saint-Esprit","🕊️ Esprit"]]:[["Vater","👑 Vater"],["Sohn","✝️ Jesus Christus"],["Heiliger Geist","🕊️ Geist"]],cards=sh(P.flatMap((x,j)=>[{j,t:x[0]},{j,t:x[1]}])),op=[],done=new Set(),lock=false;function draw(){if(done.size===P.length)return reward(lang==="fr"?"Connaître Dieu — terminé !":"Gott kennenlernen — geschafft!","✝️");G.innerHTML=`<main><h2>🧠 Memory</h2><div class=memory-grid>${cards.map((c,k)=>`<button data-k="${k}" class="memory-card ${done.has(c.j)?"done":op.includes(k)?"open":""}">${done.has(c.j)||op.includes(k)?c.t:"❓"}</button>`).join("")}</div></main>`;document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>flip(+b.dataset.k))}function flip(k){if(lock||op.includes(k)||done.has(cards[k].j))return;op.push(k);draw();if(op.length===2){lock=true;setTimeout(()=>{if(cards[op[0]].j===cards[op[1]].j)done.add(cards[op[0]].j);op=[];lock=false;draw()},650)}}draw()}start();</script></body></html>
